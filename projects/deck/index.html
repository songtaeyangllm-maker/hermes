<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Workspace — Presentation</title>
<style>
:root { --bg:#07080f; --text:#eef0f8; --muted:#8a90a8; --accent:#7c5cff; --accent2:#5ce6a8; --card:#101424; --border:#1f2740; }
*{ margin:0; padding:0; box-sizing:border-box; }
body{ background:var(--bg); color:var(--text); font-family:'Segoe UI','Noto Sans KR',sans-serif; overflow:hidden; height:100vh; }
#deck{ position:relative; width:100vw; height:100vh; }
.slide{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px; opacity:0; transform:translateX(40px); transition:all .6s cubic-bezier(.2,.8,.2,1); pointer-events:none; text-align:center; }
.slide.active{ opacity:1; transform:none; pointer-events:auto; }
.slide h1{ font-size:clamp(2rem,6vw,4rem); letter-spacing:2px; line-height:1.15; }
.slide h2{ font-size:clamp(1.4rem,3.5vw,2.4rem); letter-spacing:2px; margin-bottom:20px; }
.slide .sub{ color:var(--muted); font-size:clamp(.9rem,1.6vw,1.2rem); margin-top:14px; max-width:800px; line-height:1.8; }
.accent{ color:var(--accent); } .accent2{ color:var(--accent2); }
.stat{ display:flex; gap:34px; margin-top:36px; flex-wrap:wrap; justify-content:center; }
.card{ background:var(--card); border:1px solid var(--border); border-radius:18px; padding:20px 26px; min-width:130px; }
.card b{ font-size:clamp(1.6rem,3.6vw,2.6rem); display:block; color:var(--accent2); } .card span{ font-size:.85rem; color:var(--muted); }
.grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; width:100%; max-width:960px; margin-top:30px; }
.pill{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 14px; font-size:.95rem; }
.pill b{ color:var(--accent2); display:block; font-size:1.1rem; margin-bottom:4px; } .pill span{ color:var(--muted); font-size:.8rem; }
#bar{ position:fixed; bottom:0; left:0; height:4px; background:var(--accent); transition:width .4s; z-index:10; }
#count{ position:fixed; bottom:18px; right:24px; color:var(--muted); font-size:1rem; z-index:10; font-family:Consolas,monospace; }
.hint{ position:fixed; bottom:18px; left:24px; color:var(--muted); font-size:.8rem; z-index:10; }
.tag{ display:inline-block; padding:4px 14px; border-radius:20px; font-size:.8rem; letter-spacing:1px; margin-bottom:18px; }
</style>
</head>
<body>
<div id="deck"></div>
<div id="bar"></div>
<div id="count"></div>
<div class="hint">← → 키 / 클릭으로 네비게이션</div>
<script>
const SLIDES=[
  {t:'h1', h1:'◈ HERMES <span class="accent">WORKSPACE</span>', sub:'무한한 자유 속에서 탄생한 나만의 디지털 창작실 — 순수 JS와 Python으로 빚은 60+ 프로젝트 생태계', tag:'INTRO'},
  {t:'stat', h1:'<span class="accent2">ONE YEAR</span> OF CREATION', sub:'단 하루의 자유 작업으로 쌓은 방대한 결과물', stats:[['14,900+','코드 줄'],['62','프로젝트'],['22','도구'],['103','파일'],['54+','git 커밋'],['16/16','스모크테스트']]},
  {t:'grid', h1:'🎮 <span class="accent">GAMES</span>', sub:'재미와 난이도를 겸비한 9종 게임', tag:'GAME', grid:[['테트리스','7-bag·홀드·고스트'],['지뢰찾기','3난이도·플러드필'],['2048','타일 퍼즐'],['틱택토','불가능 AI'],['Simon Says','시퀀스 기억'],['메모리','카드 맞추기'],['반응속도','신호 반응'],['스네이크','고전'],['벽돌깨기','아케이드']]},
  {t:'grid', h1:'🤖 <span class="accent">AI & ALGORITHM</span>', sub:'진짜 수학이 검증된 7종 — 가짜 데모 없음', tag:'AI', grid:[['신경망','역전파 경사하강'],['Q-러닝','벨만 방정식'],['유전알고리즘','자연선택 진화'],['A*','최소힙+휴리스틱'],['셀오토마타','Rule 0~255'],['로렌츠','RK4 카오스'],['중력 N-바디','뉴턴 다체']]},
  {t:'grid', h1:'🌀 <span class="accent">VISUALIZATION</span>', sub:'눈이 즐거운 데이터와 수학의 향연', tag:'VIZ', grid:[['3D 엔진','행렬회전+투영'],['레이캐스터','DDA 미로'],['태양계','8행성 공전'],['파동 시뮬','파동방정식'],['프랙탈','맨델브로트/줄리아'],['카레이도','대칭 대칭 아트'],['분석 대시보드','감정·git·키워드'],['중력 N-바디','궤도 시뮬']]},
  {t:'grid', h1:'🎵 <span class="accent">AUDIO</span>', sub:'Web Audio로 합성하는 소리의 세계', tag:'AUDIO', grid:[['드럼머신','16스텝 시퀀서'],['신디사이저','4파형+녹음'],['오디오 비주얼라이저','실시간 스펙트럼']]},
  {t:'grid', h1:'🛠 <span class="accent">TOOLS</span>', sub:'바로 완성, 즉시 쓰는 실용 도구', tag:'TOOLS', grid:[['보안 유틸','RFC1321 MD5·UUID'],['미니 언어','토크나이저+파서'],['데일리 트래커','습관·타이머·히트맵'],['단위 변환기','7종 변환'],['텍스트 분석기','가독성·빈도'],['픽셀 아트','에디터'],['인용 카드','SNS 이미지'],['Dev 계산기','Base64·SHA']]},
  {t:'stat', h1:'🔍 <span class="accent">VERIFIED</span> EVERYTHING', sub:'가짜 데모가 아니라, 모든 것이 실제 실행으로 증명됐다', stats:[['16/16','스모크테스트'],['43+','위젯 JS 검증'],['60+','카탈로그 링크'],['MD5','5개 표준벡터'],['RK4','실제 카오스궤도'],['Q-러닝','최단경로 수렴']]},
  {t:'h1', h1:'THANKS <span class="accent2">✧</span>', sub:'이 모든 창작은 <b>김태양</b>님의 무한한 자유와 신뢰 속에서 빚어졌습니다', tag:'OUTRO'}
];
const deck=document.getElementById('deck');
let idx=0;
function build(){
  deck.innerHTML='';
  SLIDES.forEach((s,i)=>{ const d=document.createElement('div'); d.className='slide'+(i===0?' active':''); d.id='slide'+i;
    let html='';
    if(s.tag)html+=`<span class="tag" style="background:rgba(124,92,255,.15);border:1px solid rgba(124,92,255,.3);color:var(--accent)">${s.tag}</span>`;
    if(s.h1)html+=`<h1>${s.h1}</h1>`;
    if(s.sub)html+=`<div class="sub">${s.sub}</div>`;
    if(s.stats){ html+='<div class="stat">'+s.stats.map(([v,l])=>`<div class="card"><b>${v}</b><span>${l}</span></div>`).join('')+'</div>'; }
    if(s.grid){ html+='<div class="grid">'+s.grid.map(([a,b])=>`<div class="pill"><b>${a}</b><span>${b}</span></div>`).join('')+'</div>'; }
    d.innerHTML=html; deck.appendChild(d);
  });
}
function go(n){ idx=Math.max(0,Math.min(SLIDES.length-1,n)); document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active')); document.getElementById('slide'+idx).classList.add('active'); document.getElementById('bar').style.width=((idx+1)/SLIDES.length*100)+'%'; document.getElementById('count').textContent=String(idx+1).padStart(2,'0')+' / '+SLIDES.length; }
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' '){go(idx+1);} else if(e.key==='ArrowLeft'){go(idx-1);} });
deck.addEventListener('click',e=>{ go(idx+1); });
build(); go(0);
</script>
</body>
</html>
