<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Wave Sim</title>
<style>
:root { --bg:#04060d; --text:#dbe4f0; --muted:#6b7686; --card:#0d1424; --border:#1c2a44; }
*{ margin:0; padding:0; box-sizing:border-box; }
body{ background:var(--bg); color:var(--text); font-family:'Segoe UI',sans-serif; display:flex; flex-direction:column; align-items:center; gap:12px; padding:16px; }
h1{ font-size:19px; letter-spacing:2px; } h1 span{ color:#4dd0ff; }
.sub{ color:var(--muted); font-size:12px; }
canvas{ border:1px solid var(--border); border-radius:10px; background:#04060d; cursor:crosshair; }
.bar{ display:flex; gap:9px; flex-wrap:wrap; justify-content:center; align-items:center; }
.btn{ background:#16223a; color:#dbe4f0; border:1px solid var(--border); border-radius:8px; padding:6px 13px; cursor:pointer; font-size:12px; }
.btn:hover{ background:#1f3050; } .btn.active{ background:#4dd0ff; color:#041018; font-weight:600; }
.badge{ background:var(--card); border:1px solid var(--border); border-radius:8px; padding:5px 11px; font-size:12px; color:var(--muted); }
input[type=range]{ accent-color:#4dd0ff; }
</style>
</head>
<body>
<h1>WAVE <span>· RIPPLE</span></h1>
<div class="sub">파동방정식 d²u/dt² = c²∇²u — 수면 위로 퍼지는 잔물결</div>
<canvas id="cv" width="760" height="500"></canvas>
<div class="bar">
  <button class="btn active" id="pCyan">🌊 청록</button>
  <button class="btn" id="pNeon">✨ 네온</button>
  <button class="btn" id="pFire">🔥 불꽃</button>
  <button class="btn" id="pMono">⬜ 모노</button>
  <span class="badge">속도 <input type="range" id="spd" min="1" max="6" value="3"></span>
  <span class="badge">감쇠 <input type="range" id="dmp" min="0.96" max="0.999" step="0.001" value="0.99"></span>
  <button class="btn" id="clr">🗑️ 지우기</button>
  <span class="badge">높이 <b id="mx">0.00</b></span>
</div>
<script>
const W=760,H=500,COL=190,ROW=125;
const cv=document.getElementById('cv'), g=cv.getContext('2d');
const cw=W/COL, ch=H/ROW;
let buf1=new Float32Array(COL*ROW), buf2=new Float32Array(COL*ROW);
let palette='cyan'; let speed=3, damp=0.99;
const PAL={
  cyan:(v)=>{ const t=Math.max(0,Math.min(1,v)); return `rgb(${35+(1-t)*40},${120+(1-t)*90},${255-(1-t)*80})`; },
  neon:(v)=>{ const t=Math.max(0,Math.min(1,v)); return `hsl(${190+v*240},100%,${50+t*40}%)`; },
  fire:(v)=>{ const t=Math.max(0,Math.min(1,v)); return `hsl(${(1-t)*60},100%,${45+t*45}%)`; },
  mono:(v)=>{ const n=Math.round(40+v*180); return `rgb(${n},${n},${n+18})`; }
};
function splash(cx,cy,amp){
  const r=Math.max(3,amp*6);
  const x0=Math.floor(cx/cw), y0=Math.floor(cy/ch);
  for(let dy=-3;dy<=3;dy++) for(let dx=-3;dx<=3;dx++){
    const x=x0+dx, y=y0+dy; if(x<0||y<0||x>=COL||y>=ROW) continue;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<=3) buf1[y*COL+x]+=Math.cos(d/3*Math.PI)*amp*(1-d/3.4);
  }
}
cv.addEventListener('mousedown',e=>{ const r=cv.getBoundingClientRect(); const mx=e.clientX-r.left, my=e.clientY-r.top; splash(mx,my,1); pointerDown=true; });
let pointerDown=false;
cv.addEventListener('mousemove',e=>{ if(pointerDown){ const r=cv.getBoundingClientRect(); splash(e.clientX-r.left,e.clientY-r.top,0.4); } });
window.addEventListener('mouseup',()=>pointerDown=false);
// touch
cv.addEventListener('touchmove',e=>{ e.preventDefault(); const t=e.touches[0], r=cv.getBoundingClientRect(); splash(t.clientX-r.left,t.clientY-r.top,0.5); },{passive:false});
function step(){
  const cur=buf1, nxt=buf2;
  for(let y=1;y<ROW-1;y++) for(let x=1;x<COL-1;x++){
    const i=y*COL+x;
    nxt[i]=2*cur[i]-nxt[i]
      +0.5*(cur[(y-1)*COL+x]+cur[(y+1)*COL+x]+cur[y*COL+x-1]+cur[y*COL+x+1]-4*cur[i])
      -nxt[i]*0.01;
    nxt[i]=cur[i]+(nxt[i]-cur[i])*0.35;
  }
  for(let i=0;i<COL*ROW;i++){ const t=nxt[i]; nxt[i]=cur[i]; cur[i]=t*damp; }
}
function draw(){
  const col=document.createElement('canvas'); col.width=COL; col.height=ROW; const c2=col.getContext('2d');
  const img=c2.createImageData(COL,ROW);
  const p=PAL[palette]; let maxv=0;
  for(let i=0;i<COL*ROW;i++){
    const v=buf1[i]; maxv=Math.max(maxv,Math.abs(v));
    const colr=p(v*15);
    const m=colr.match(/\d+/g);
    const o=i*4; img.data[o]=+m[0]; img.data[o+1]=+m[1]; img.data[o+2]=+m[2]; img.data[o+3]=255;
  }
  c2.putImageData(img,0,0);
  g.imageSmoothingEnabled=true;
  g.drawImage(col,0,0,W,H);
  document.getElementById('mx').textContent=(maxv).toFixed(2);
  // disp domain
  for(let i=0;i<buf1.length;i++)buf2[i]=0;
  for(let s=0;s<speed;s++) step();
  requestAnimationFrame(draw);
}
document.getElementById('spd').addEventListener('input',e=>speed=+e.target.value);
document.getElementById('dmp').addEventListener('input',e=>damp=+e.target.value);
document.getElementById('clr').addEventListener('click',()=>{ buf1=new Float32Array(COL*ROW); buf2=new Float32Array(COL*ROW); });
[['pCyan','cyan'],['pNeon','neon'],['pFire','fire'],['pMono','mono']].forEach(([id,key])=>{
  document.getElementById(id).addEventListener('click',e=>{
    palette=key; document.querySelectorAll('#pCyan,#pNeon,#pFire,#pMono').forEach(b=>b.classList.remove('active')); e.target.classList.add('active');
  });
});
// initial ripples
splash(W/2,H/2,1); splash(W*0.3,H*0.4,0.8); splash(W*0.7,H*0.6,0.8);
draw();
</script>
</body>
</html>
