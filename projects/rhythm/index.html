<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Rhythm</title>
<style>
:root { --bg:#0b0e16; --text:#e5e7eb; --muted:#6b7686; --card:#121826; --border:#1e2840; --accent:#f472b6; }
*{ margin:0; padding:0; box-sizing:border-box; }
body{ background:var(--bg); color:var(--text); font-family:'Segoe UI',sans-serif; display:flex; flex-direction:column; align-items:center; gap:12px; padding:16px; }
h1{ font-size:20px; letter-spacing:2px; } h1 span{ color:var(--accent); }
.sub{ color:var(--muted); font-size:12px; }
.wrap{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
#stage{ position:relative; width:420px; height:480px; background:linear-gradient(180deg,#131a2c,#0d1322); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
.lane{ position:absolute; top:0; bottom:0; width:25%; border-left:1px solid rgba(255,255,255,.06); }
.lane:nth-child(1){left:0}.lane:nth-child(2){left:25%}.lane:nth-child(3){left:50%}.lane:nth-child(4){left:75%}
.judgeLine{ position:absolute; bottom:90px; left:0; right:0; height:3px; background:var(--accent); box-shadow:0 0 12px var(--accent); z-index:5; }
.note{ position:absolute; width:18%; height:12px; border-radius:3px; z-index:2; }
.note.x0{left:3.5%}.note.x1{left:28.5%}.note.x2{left:53.5%}.note.x3{left:78.5%}
.keyRow{ position:absolute; bottom:0; left:0; right:0; height:90px; display:flex; z-index:6; }
.key{ flex:1; display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--muted); border-top:1px solid var(--border); background:rgba(20,28,48,.6); }
.key.down{ background:var(--accent); color:#0b0e16; }
.judge{ position:absolute; bottom:150px; left:0; right:0; text-align:center; font-size:26px; font-weight:bold; z-index:7; pointer-events:none; text-shadow:0 0 18px var(--accent); }
.combo{ position:absolute; top:14px; left:0; right:0; text-align:center; font-size:34px; font-weight:bold; color:var(--text); z-index:7; pointer-events:none; text-shadow:0 2px 10px rgba(0,0,0,.6); }
.hud{ position:absolute; top:8px; left:10px; font-size:12px; color:var(--muted); z-index:7; }
.side{ display:flex; flex-direction:column; gap:10px; width:180px; }
.panel{ background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px; }
.score{ font-size:26px; font-weight:bold; color:var(--accent); text-align:center; }
.stat{ display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:6px; }
.btn{ background:#16223a; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px 14px; cursor:pointer; font-size:13px; width:100%; }
.btn:hover{ background:#1f3050; } .btn.accent{ background:var(--accent); color:#0b0e16; font-weight:bold; }
.btn.on{ border-color:var(--accent); background:#1f3050; }
.hint{ color:var(--muted); font-size:11px; line-height:1.7; }
</style>
</head>
<body>
<h1>RHYTHM <span>::</span> BEAT</h1>
<div class="sub">D·F·J·K 키로 연주 — 정확한 타이밍에 판정 라인에서!</div>
<div class="wrap">
  <div id="stage">
    <div class="lane"></div><div class="lane"></div><div class="lane"></div><div class="lane"></div>
    <div class="judgeLine"></div>
    <div class="judge" id="judge"></div>
    <div class="combo" id="combo"></div>
    <div class="hud" id="hud">▶ READY</div>
    <div class="keyRow" id="keys"></div>
  </div>
  <div class="side">
    <div class="panel"><div class="score" id="score">0</div><div class="stat"><span>최고</span><span id="best">0</span></div><div class="stat"><span>콤보</span><span id="comboN">0</span></div><div class="stat"><span>Perfect</span><span id="pPerfect">0</span></div><div class="stat"><span>Great</span><span id="pGreat">0</span></div><div class="stat"><span>Good</span><span id="pGood">0</span></div><div class="stat"><span>Miss</span><span id="pMiss">0</span></div></div>
    <div class="panel"><b style="font-size:12px;color:var(--muted)">곡 선택</b><div style="display:flex;flex-direction:column;gap:6px;margin-top:6px"><button class="btn on" id="song1">⚡ 전기질주</button><button class="btn" id="song2">🌙 밤바다</button></div></div>
    <button class="btn accent" id="startBtn">▶ 시작</button>
    <div class="hint">D·F = 왼손, J·K = 오른손<br>타이밍: Perfect ±60ms · Great ±110ms · Good ±180ms</div>
  </div>
</div>
<script>
// ============ 오디오 ============
let AC=null; function ac(){ if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function beep(freq,dur,type='sine',vol=.15){ const c=ac(); const o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.value=freq; g.gain.value=vol; g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur); o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur); }
// ============ 곡 데이터 (BPM + 채보) ============
// 채보: [비트(4분음표 기준), 레인(0-3)] .  비트는 1초당 BPM/60
const SONGS=[
 {name:'⚡ 전기질주',bpm:140,notes:[[0,1],[1,2],[2,1],[3,3],[4,0],[4,2],[5,1],[6,2],[7,3],[8,0],[9,1],[10,2],[11,3],[12,0],[12,3],[13,1],[14,2],[15,0],[16,1],[17,3],[18,0],[19,2],[20,1],[20,3],[22,0],[23,2],[24,1],[25,2],[26,3],[27,0],[28,1],[30,2],[31,3],[32,0],[32,1],[33,2],[34,3],[36,0],[36,3],[38,1],[39,2],[40,1],[41,0],[42,2],[43,3],[44,0],[45,1],[46,2],[47,3],[48,0],[49,1],[50,2],[52,3],[53,0],[54,2],[55,1],[56,0],[57,2],[58,1],[59,3],[60,1],[60,2],[62,0],[63,3],[64,1]]},
 {name:'🌙 밤바다',bpm:90,notes:[[0,1],[2,2],[4,0],[6,3],[8,1],[10,0],[12,2],[14,3],[16,0],[16,3],[18,1],[20,0],[22,3],[24,2],[26,1],[28,0],[30,2],[32,1],[33,3],[34,0],[36,2],[38,1],[40,3],[42,0],[44,1],[46,3],[48,2],[49,0],[50,1],[52,3],[54,2],[56,1],[58,0],[60,2],[62,3],[64,0]]}
];
let songIdx=0, notes=[], active=[], score=0, combo=0, bestC=0, startTime=0, playing=false, lastBeat=0, judgeTimer=null, stats={P:0,G:0,o:0,M:0};
const KEYS=['d','f','j','k'], KEYMAP={d:0,f:1,j:2,k:3}, NOTE_SPEED=460; // px/sec
const JUDGE_WIN={P:0.06,G:0.11,o:0.18};
function pick(){ songIdx=arguments.length?songIdx:songIdx; }
document.getElementById('song1').onclick=()=>{songIdx=0;diff();}; document.getElementById('song2').onclick=()=>{songIdx=1;diff();};
function diff(){ ['song1','song2'].forEach(i=>document.getElementById(i).classList.remove('on')); document.getElementById('song'+(songIdx+1)).classList.add('on'); if(!playing){ /* 미리보기 비트 */ for(let i=0;i<8;i++)setTimeout(()=>beep(440+Math.sin(i)*100,.08,'square',.08),i*300); } }
diff();
function buildNotes(){
  const s=SONGS[songIdx], beat=60/s.bpm; notes=s.notes.map(n=>({lane:n[1],time:n[0]*beat,judged:false}));
}
// ============ 게임 루프 ============
const stage=document.getElementById('stage');
function renderNotes(){
  document.querySelectorAll('.note').forEach(n=>n.remove());
  if(!playing)return;
  const now=(performance.now()-startTime)/1000;
  notes.filter(n=>!n.judged).forEach(n=>{
    const timeLeft=n.time-now; if(timeLeft>-0.3&&timeLeft<2.2){
      const el=document.createElement('div'); el.className='note x'+n.lane;
      const y=480-90-(timeLeft*NOTE_SPEED); el.style.top=y+'px';
      const colors=['#f472b6','#60a5fa','#facc15','#4ade80']; el.style.background=colors[n.lane];
      el.style.boxShadow='0 0 10px '+colors[n.lane];
      el.dataset.idx=notes.indexOf(n); stage.appendChild(el);
    }
    if(timeLeft<-0.3&&!n.judged){// miss
      n.judged=true; combo=0; stats.M++; judge('MISS','#ef4444'); updateHud();
    }
  });
  if(combo>bestC)bestC=combo;
  document.getElementById('combo').textContent=combo>1?combo+'':''; 
}
function judge(txt,color){ const el=document.getElementById('judge'); el.textContent=txt; el.style.color=color; el.style.opacity=1; clearTimeout(judgeTimer); judgeTimer=setTimeout(()=>el.style.opacity=0,350); }
function hit(lane){
  if(!playing)return;
  const now=(performance.now()-startTime)/1000;
  const candidates=notes.filter(n=>!n.judged&&n.lane===lane&&Math.abs(n.time-now)<0.2);
  if(!candidates.length){ beep(120,.06,'sawtooth',.05); return; }
  const n=candidates.reduce((a,b)=>Math.abs(a.time-now)<Math.abs(b.time-now)?a:b);
  const diffT=Math.abs(n.time-now); n.judged=true;
  let kind='o',pts=50,color='#94a3b8';
  if(diffT<=JUDGE_WIN.P){kind='P';pts=300;color='#facc15';}
  else if(diffT<=JUDGE_WIN.G){kind='G';pts=200;color='#4ade80';}
  else {kind='o';pts=100;color='#60a5fa';}
  combo++; if(combo>bestC)bestC=combo; score+=pts*Math.min(10,1+Math.floor(combo/10)); stats[kind==='o'?'o':kind==='P'?'P':'G']++;
  judge(kind==='P'?'PERFECT':kind==='G'?'GREAT':'GOOD',color);
  beep(lane===0?523:lane===1?587:lane===2?659:784,.1,'square',.12);
  updateHud(); renderNotes();
}
function updateHud(){ document.getElementById('score').textContent=score; document.getElementById('pPerfect').textContent=stats.P; document.getElementById('pGreat').textContent=stats.G; document.getElementById('pGood').textContent=stats.o; document.getElementById('pMiss').textContent=stats.M; document.getElementById('comboN').textContent=combo; document.getElementById('best').textContent=bestC; document.getElementById('combo').textContent=combo>1?combo:''; }
function flashKey(lane){ document.querySelectorAll('.key')[lane].classList.add('down'); setTimeout(()=>document.querySelectorAll('.key')[lane].classList.remove('down'),90); }
window.addEventListener('keydown',e=>{ const l=KEYMAP[e.key.toLowerCase()]; if(l!==undefined){ e.preventDefault(); flashKey(l); hit(l); } });
// 터치/클릭 키
document.querySelectorAll('.key').forEach((k,i)=>k.onmousedown=()=>{flashKey(i);hit(i);});
function start(){
  const s=SONGS[songIdx];
  notes=[]; active=[]; score=0; combo=0; stats={P:0,G:0,o:0,M:0}; playing=true; judge(''); 
  buildNotes(); startTime=performance.now();
  // 오디오 보조 비트 (웹 오디오로 짧은 비트 연주)
  const beat=60/s.bpm;
  // 사전 등록된 비트: 4개마다 베이스
  document.getElementById('hud').textContent='▶ PLAYING ('+s.name+')';
  updateHud(); setTimeout(()=>{ if(notes.every(n=>n.judged)&&playing){ playing=false; document.getElementById('hud').textContent='⏹ 완료! 점수 '+score; const last=document.getElementById('best'); if(score>parseInt(localStorage.getItem('rhythmBest')||0)){ localStorage.setItem('rhythmBest',score); } } }, s.notes[s.notes.length-1][0]*beat*1000+2000);
}
document.getElementById('startBtn').onclick=start;
// 키 라벨
document.getElementById('keys').innerHTML=KEYS.map(k=>`<div class="key">${k.toUpperCase()}</div>`).join('');
// 루프
function loop(){ renderNotes(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
