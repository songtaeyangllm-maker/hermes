<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Command Center</title>
<style>
    :root { --bg:#0b0b12; --card:#13131c; --text:#ececf5; --muted:#6b6f82; --border:#23233a; --accent:#7c5cff; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,'Segoe UI','Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:36px 24px; }
    .wrap { max-width:1100px; margin:0 auto; }
    .hero { display:flex; align-items:center; justify-content:space-between; margin-bottom:30px; flex-wrap:wrap; gap:16px; }
    .hero h1 { font-size:1.9rem; font-weight:800; }
    .hero h1 span { color:var(--accent); }
    .clock { font-size:1.1rem; color:var(--muted); font-variant-numeric:tabular-nums; }

    .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:30px; }
    .kpi { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:18px 20px; }
    .kpi .l { font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
    .kpi .v { font-size:1.7rem; font-weight:800; color:var(--accent); margin-top:4px; }
    .kpi .s { font-size:0.75rem; color:var(--muted); margin-top:3px; }

    .section-title { font-size:1.15rem; font-weight:700; margin:30px 0 14px; color:var(--accent); }

    .sys-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; }
    .sys { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px 20px; }
    .sys .n { font-size:0.8rem; color:var(--muted); margin-bottom:8px; }
    .bar { height:10px; background:#1c1c28; border-radius:8px; overflow:hidden; }
    .bar-fill { height:100%; border-radius:8px; transition:width 0.5s; }
    .sys .val { text-align:right; font-size:0.8rem; color:var(--text); margin-top:5px; font-weight:600; }

    .proj-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
    .proj { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px 20px; }
    .proj .top { display:flex; justify-content:space-between; align-items:center; }
    .proj .name { font-weight:700; font-size:0.98rem; }
    .proj .status { font-size:0.66rem; padding:3px 10px; border-radius:12px; font-weight:700; text-transform:uppercase; }
    .st-active { background:rgba(92,230,168,0.15); color:#5ce6a8; }
    .st-done { background:rgba(124,92,255,0.15); color:#b39cff; }
    .st-planned { background:rgba(255,207,92,0.15); color:#ffcf5c; }
    .st-paused { background:rgba(255,143,92,0.15); color:#ff8a5c; }
    .proj .desc { font-size:0.78rem; color:var(--muted); margin-top:7px; }
    .proj .path { font-size:0.68rem; color:var(--border); margin-top:8px; font-family:monospace; }

    .tool-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; }
    .tool { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 18px; display:flex; align-items:center; gap:12px; }
    .tool .ico { font-size:1.5rem; }
    .tool .t { font-size:0.92rem; font-weight:700; }
    .tool .d { font-size:0.72rem; color:var(--muted); }

    .footer { text-align:center; margin-top:44px; padding-top:20px; border-top:1px solid var(--border); color:var(--muted); font-size:0.78rem; }
</style>
</head>
<body>
<div class="wrap">
    <div class="hero">
        <h1>⚡ <span>HERMES</span> COMMAND CENTER</h1>
        <div class="clock" id="clock"></div>
    </div>

    <div class="kpis">
        <div class="kpi"><div class="l">프로젝트</div><div class="v" id="kpiProj">0</div><div class="s" id="kpiProjActive">0 active</div></div>
        <div class="kpi"><div class="l">Python 도구</div><div class="v" id="kpiTools">0</div><div class="s">tools/</div></div>
        <div class="kpi"><div class="l">코드 라인</div><div class="v" id="kpiLines">0</div><div class="s">.py 기준</div></div>
        <div class="kpi"><div class="l">웹 위젯</div><div class="v" id="kpiWidgets">0</div><div class="s">projects/</div></div>
    </div>

    <div class="section-title">🖥️ 시스템 상태</div>
    <div class="sys-grid" id="sysGrid"></div>

    <div class="section-title">🗂️ 프로젝트 보드</div>
    <div class="proj-list" id="projList"></div>

    <div class="section-title">🛠️ 도구 함</div>
    <div class="tool-grid" id="toolGrid"></div>

    <div class="footer">Hermes Workspace · 자유롭게 만들어진 지휘 센터 · <span id="today"></span></div>
</div>

<script src="../../dashboard/data.js"></script>
<script src="../../dashboard/projects.js"></script>
<script>
    const SYS = window.HERMES_DATA || {};
    const PROJS = (window.HERMES_PROJECTS || []);

    // Clock
    function tick() {
        document.getElementById('clock').textContent = new Date().toLocaleTimeString('ko-KR');
    }
    tick(); setInterval(tick, 1000);

    // KPIs
    const pyTools = PROJS;
    const numPy = 14; // approx python tools
    document.getElementById('kpiProj').textContent = PROJS.length;
    document.getElementById('kpiProjActive').textContent =
        PROJS.filter(p => p.status === 'active').length + ' active';
    const widgetFolders = ['sns_showcase','diary_heatmap','speedometer','treemap','badge','timeline','wordcloud','snake','typing','showcase','breakout','fortune'];
    document.getElementById('kpiWidgets').textContent = widgetFolders.length;

    // System bars — extract to reusable fn
    const sys = document.getElementById('sysGrid');
    function renderSys(data) {
        sys.innerHTML = '';
        const memPct = data.memory && data.memory.percent;
        const diskPct = data.disk && data.disk.percent;
        const metrics = [
            ['CPU', data.cpu_percent != null ? data.cpu_percent : data.cpu, '#7c5cff'],
            ['메모리', memPct, '#5c8aff'],
            ['디스크', diskPct, '#5ce6a8'],
        ];
        metrics.forEach(([n, v, c]) => {
            const el = document.createElement('div');
            el.className = 'sys';
            el.innerHTML = `<div class="n">${n}</div><div class="bar"><div class="bar-fill" style="width:${Math.min(100,v||0)}%;background:${c}"></div></div><div class="val">${(v||0).toFixed(0)}%</div>`;
            sys.appendChild(el);
        });
        if (data.memory && data.memory.total_gb) {
            const el = document.createElement('div');
            el.className = 'sys';
            el.innerHTML = `<div class="n">메모리 사용량</div><div class="val" style="margin-top:20px;font-size:1rem">${data.memory.used_gb} / ${data.memory.total_gb} GB</div>`;
            sys.appendChild(el);
        }
        if (data.disk && data.disk.total_gb) {
            const el = document.createElement('div');
            el.className = 'sys';
            el.innerHTML = `<div class="n">디스크 여유</div><div class="val" style="margin-top:20px;font-size:1rem">${data.disk.free_gb} GB 남음</div>`;
            sys.appendChild(el);
        }
        if (data.processes != null) {
            const el = document.createElement('div');
            el.className = 'sys';
            el.innerHTML = `<div class="n">프로세스</div><div class="val" style="margin-top:20px;font-size:1.6rem;font-weight:800;color:var(--accent)">${data.processes}</div>`;
            sys.appendChild(el);
        }
    }
    renderSys(SYS);

    // Live refresh from local API server (falls back to bundled data)
    async function refreshLive() {
        try {
            const r = await fetch('http://127.0.0.1:8765/api/status');
            if (r.ok) renderSys(await r.json());
        } catch (e) { /* server off — keep bundled data */ }
    }
    refreshLive();
    setInterval(refreshLive, 5000);

    // Projects
    const pl = document.getElementById('projList');
    PROJS.forEach(p => {
        const el = document.createElement('div');
        el.className = 'proj';
        const stCls = 'st-' + (p.status || 'planned');
        el.innerHTML = `
            <div class="top"><span class="name">${p.name}</span><span class="status ${stCls}">${p.status||'planned'}</span></div>
            <div class="desc">${p.desc || ''}</div>
            ${p.path ? `<div class="path">${p.path}</div>` : ''}`;
        pl.appendChild(el);
    });
    if (PROJS.length === 0) pl.innerHTML = '<div style="color:var(--muted)">프로젝트 없음</div>';

    // Tools
    const tg = document.getElementById('toolGrid');
    const tools = [
        ['🧰','hermes_toolkit.py','워크스페이스 관리 툴킷'],
        ['🩺','system_diagnostics.py','시스템 진단/모니터'],
        ['📁','project_tracker.py','프로젝트 관리'],
        ['📔','diary.py','일기/메모'],
        ['🗂️','file_utils.py','파일/이미지 유틸'],
        ['🌐','net_utils.py','네트워크 진단'],
        ['📝','md2html.py','MD→HTML 변환'],
        ['🗺️','treemap.py','폴더 트리맵'],
        ['🏅','badge.py','상태 뱃지'],
        ['🔍','search_notes.py','TF-IDF 노트 검색'],
        ['⏱️','autocommit.py','자동 git 커밋'],
        ['☁️','wordcloud.py','워드클라우드'],
        ['🕒','timeline.py','활동 타임라인'],
        ['📊','auto_report.py','일일 보고서'],
    ];
    document.getElementById('kpiTools').textContent = tools.length;
    document.getElementById('kpiLines').textContent = '5.9k+';
    tools.forEach(([ico, name, desc]) => {
        const el = document.createElement('div');
        el.className = 'tool';
        el.innerHTML = `<span class="ico">${ico}</span><div><div class="t">${name}</div><div class="d">${desc}</div></div>`;
        tg.appendChild(el);
    });

    document.getElementById('today').textContent = new Date().toLocaleDateString('ko-KR', {year:'numeric',month:'long',day:'numeric'});
</script>
</body>
</html>
