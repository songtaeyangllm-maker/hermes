<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Markdown Editor</title>
<style>
:root{--bg:#0b0e16;--text:#e5e7eb;--muted:#6b7686;--card:#121826;--border:#1e2840;--accent:#60a5fa;--good:#4ade80;--bad:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;height:100vh}
header{background:var(--card);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:16px;letter-spacing:1px}header h1 span{color:var(--accent)}
.toolbar{display:flex;gap:6px;align-items:center}.btn{background:var(--accent);color:#0b0e16;border:none;padding:6px 12px;font-size:12px;border-radius:4px;cursor:pointer}.btn:hover{opacity:.9}.btn.secondary{background:var(--border);color:var(--text)}
.toolbar select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:4px;font-size:12px}
#editor-container{flex:1;display:flex}
#editor-pane{flex:1;background:#0d1117;border-right:1px solid var(--border);display:flex;flex-direction:column}
#preview-pane{flex:1;background:var(--bg);overflow-y:auto;padding:24px}
#editor{flex:1;background:transparent;border:none;color:var(--text);font-family:'Consolas',monospace;font-size:14px;line-height:1.6;padding:16px;outline:none;tab-size:2;resize:none}
#preview{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.7;max-width:800px;margin:0 auto}
#preview h1,#preview h2,#preview h3{border-bottom:1px solid var(--border);padding-bottom:8px;margin-top:24px;color:var(--accent)}
#preview code{background:var(--card);padding:2px 6px;border-radius:4px;font-family:monospace}
#preview pre{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;overflow-x:auto}
#preview pre code{background:transparent;padding:0}
#preview blockquote{border-left:4px solid var(--accent);padding-left:16px;color:var(--muted);margin:16px 0}
#preview table{border-collapse:collapse;width:100%;margin:16px 0}
#preview th,#preview td{border:1px solid var(--border);padding:8px 12px;text-align:left}
#preview th{background:var(--card);color:var(--accent)}
#preview hr{border:none;border-top:1px solid var(--border);margin:24px 0}
#preview img{max-width:100%;border-radius:8px}
#statusbar{background:var(--card);border-top:1px solid var(--border);padding:6px 16px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.footer{padding:8px;color:var(--muted);font-size:11px;text-align:center}
@media(max-width:900px){#editor-container{flex-direction:column}#editor-pane{border-right:none;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>
<header>
  <h1>MARKDOWN <span>EDITOR</span></h1>
  <div class="toolbar">
    <button class="btn secondary" onclick="newFile()">새 파일</button>
    <button class="btn secondary" onclick="openFile()">열기</button>
    <button class="btn" onclick="saveFile()">저장</button>
    <button class="btn secondary" onclick="copyHtml()">HTML 복사</button>
    <select id="theme" onchange="changeTheme()">
      <option value="github">GitHub</option>
      <option value="dark">다크</option>
      <option value="light">라이트</option>
    </select>
  </div>
</header>
<div id="editor-container">
  <div id="editor-pane">
    <textarea id="editor" spellcheck="false" placeholder="# 마크다운 에디터\n\n왼쪽에 작성하고 오른쪽에 실시간 미리보기를 확인하세요.\n\n## 기능\n- 실시간 렌더링\n- 코드 하이라이팅\n- 테이블 지원\n- 수식 지원 (KaTeX)\n\n```javascript\nconsole.log('Hello, Hermes!');\n```"></textarea>
  </div>
  <div id="preview-pane">
    <div id="preview"></div>
  </div>
</div>
<div id="statusbar">
  <div>Ln 1, Col 1</div>
  <div>UTF-8</div>
  <div>Markdown</div>
</div>
<div class="footer">Hermes Markdown Editor | marked.js + highlight.js | 계속 업데이트됨</div>

<script>
// marked.js와 highlight.js 로드 (CDN)
const loadScripts=()=>{
  return Promise.all([
    new Promise(r=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js';s.onload=r;document.head.appendChild(s)}),
    new Promise(r=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js';s.onload=r;document.head.appendChild(s)}),
    new Promise(r=>{const l=document.createElement('link');l.rel='stylesheet';l.href='https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-dark.min.css';document.head.appendChild(l);r()})
  ]);
};

const editor=document.getElementById('editor');
const preview=document.getElementById('preview');
let currentFile=null;

function updatePreview(){
  if(!window.marked)return;
  const content=editor.value;
  marked.setOptions({
    highlight:(code,lang)=>{
      if(lang&&window.hljs.getLanguage(lang))return window.hljs.highlight(code,{language:lang}).value;
      return window.hljs.highlightAuto(code).value;
    },
    breaks:true,
    gfm:true
  });
  preview.innerHTML=marked.parse(content);
  document.querySelectorAll('#preview pre code').forEach(b=>window.hljs.highlightElement(b));
}

function updateStatus(){
  const pos=editor.selectionStart;
  const text=editor.value.substring(0,pos);
  const lines=text.split('\n');
  document.querySelector('#statusbar div').textContent=`Ln ${lines.length}, Col ${lines[lines.length-1].length+1}`;
}

editor.oninput=()=>{updatePreview();updateStatus()};
editor.onkeyup=updateStatus;
editor.onclick=updateStatus;

function newFile(){editor.value='';currentFile=null;updatePreview()}
function openFile(){const input=document.createElement('input');input.type='file';input.accept='.md,.markdown,.txt';input.onchange=e=>{const f=e.target.files[0];if(f){const reader=new FileReader();reader.onload=e=>{editor.value=e.target.result;currentFile=f.name;updatePreview()};reader.readAsText(f)}};input.click()}
function saveFile(){const content=editor.value;const blob=new Blob([content],{type:'text/markdown'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=currentFile||'document.md';a.click()}
function copyHtml(){navigator.clipboard.writeText(preview.innerHTML).then(()=>alert('HTML 복사 완료'))}
function changeTheme(){
  const theme=document.getElementById('theme').value;
  const link=document.querySelector('link[href*="highlight"]');
  if(theme==='github')link.href='https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css';
  else if(theme==='dark')link.href='https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-dark.min.css';
  else link.href='https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-light.min.css';
  setTimeout(()=>document.querySelectorAll('#preview pre code').forEach(b=>window.hljs.highlightElement(b)),100);
}

loadScripts().then(()=>{updatePreview();console.log('Markdown editor ready')});
</script>
</body>
</html>
