<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Calendar</title>
<style>
:root { --bg:#0b0e16; --text:#e5e7eb; --muted:#6b7686; --card:#121826; --border:#1e2840; --accent:#60a5fa; --good:#4ade80; --bad:#ef4444; }
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;padding:32px}h1{font-size:28px;letter-spacing:2px;margin-bottom:8px}h1 span{color:var(--accent)}.sub{color:var(--muted);font-size:14px;margin-bottom:32px}.calendar{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;max-width:800px}.month-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.month-nav button{background:var(--card2);border:1px solid var(--border);padding:8px 12px;font-size:14px;cursor:pointer}.month-nav button:disabled{opacity:.5;cursor:not-allowed}.current-month{font-size:20px;font-weight:bold;color:var(--text)}.day-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:auto auto;gap:4px}.day-head{grid-column:1/8;background:var(--card2);padding:8px;font-size:12px;color:var(--muted);text-align:center}.day-cell{background:var(--card2);padding:12px;font-size:13px;color:var(--text);border-radius:6px;cursor:pointer}.day-cell.other-month{color:var(--muted)}.day-cell.today{background:var(--accent);color:#0b0e16;font-weight:bold}.day-cell.selected{background:var(--good);color:#0b0e16;font-weight:bold}.day-cell.event{background:var(--good);color:#0b0e16}.event-indicator{position:absolute;bottom:4px;width:8px;height:8px;border-radius:50%;background:var(--accent)}.event-list{margin-top:16px;padding:12px;background:var(--card2);border-radius:8px;max-height:200px;overflow-y:auto}.event-item{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;color:var(--muted).event-time{color:var(--accent)}.new-event{margin-top:16px}.form-row{display:flex;gap:8px;flex-wrap:wrap}.form-row input,.form-row select{background:var(--card2);border:1px solid var(--border);padding:8px;font-size:13px;color:var(--text);border-radius:6px}.form-row input{flex:1}.add-event{background:var(--accent);color:#0b0e16;border:none;padding:8px 16px;font-size:13px;margin-top:8px;cursor}.event-list-empty{color:var(--muted);text-align:center;padding:16px}.footer{margin-top:32px;color:var(--muted);font-size:12px;text-align:center}.link{color:var(--accent);text-decoration:none;font-weight:bold;font-size:13px}.link:hover{text-decoration:underline}</style>
</head>
<body>
<h1>CALENDAR <span></span></h1>
<div class="sub">일정 관리·조회·내보내기</div>
<div class="calendar" id="calendar">
  <div class="month-nav">
    <button class="prev" onclick="prevMonth()">← 이전</button>
    <span class="current-month" id="currentMonth">2026년 9월</span>
    <button class="next" onclick="nextMonth()">다음 →</button>
  </div>
  <div class="day-grid" id="dayGrid">
    <!-- 요일 헤드 -->
    <div class="day-head">일</div><div class="day-head">월</div><div class="day-head">화</div><div class="day-head">수</div><div class="day-head">목</div><div class="day-head">금</div><div class="day-head">토</div>
  </div>
</div>
<div class="new-event" style="margin-top:24px">
  <div class="form-row">
    <input type="date" id="eventDate" style="flex:1">
    <select id="eventTime" style="width:120px">
      <option value="">시간 선택</option>
      <option value="09:00">09:00</option>
      <option value="10:00">10:00</option>
      <option value="11:00">11:00</option>
      <option value="12:00">12:00</option>
      <option value="13:00">13:00</option>
      <option value="14:00">14:00</option>
      <option value="15:00">15:00</option>
      <option value="16:00">16:00</option>
      <option value="17:00">17:00</option>
      <option value="18:00">18:00</option>
      <option value="19:00">19:00</option>
      <option value="20:00">20:00</option>
      <option value="21:00">21:00</option>
      <option value="22:00">22:00</option>
      <option value="23:00">23:00</option>
    </select>
    <input type="text" id="eventTitle" placeholder="제목 입력">
    <button class="add-event" onclick="addEvent()">추가</button>
  </div>
</div>
<div class="event-list" id="eventList">
  <div class="event-list-empty">아직 등록된 일정이 없습니다</div>
</div>
<script>
// 데이터 저장소 (localStorage)
let events = JSON.parse(localStorage.getItem('hermesEvents')||'[]');
let currentDate = new Date();
function formatDate(d){return d.toISOString().split('T')[0]}
function loadEvents(dateStr){return events.filter(e=>formatDate(new Date(e.date))===dateStr)}
function saveEvents(){localStorage.setItem('hermesEvents',JSON.stringify(events))}
function renderCalendar(){
  const year=currentDate.getFullYear(),month=currentDate.getMonth();
  document.getElementById('currentMonth').textContent=`${year}년 ${month+1}월`;
  // 요일은 이미 위에 렌더링돼서 건너뜀
  const firstDay=new Date(year,month,1).getDay();
  const lastDay=new Date(year,month+1,0).getDate();
  const container=document.getElementById('dayGrid');
  container.innerHTML='';
  // 빈 셀 채우기
  for(let i=0;i<firstDay;i++){const c=document.createElement('div');c.className='day-cell other-month';c.textContent='';container.appendChild(c)}
  for(let d=1;d<=lastDay;d++){const cell=document.createElement('div');cell.className='day-cell';const dObj=new Date(year,month,d);const dateStr=formatDate(dObj);const dayEvents=loadEvents(dateStr);cell.textContent=d;cell.onclick=()=>{selectDate(dObj);renderEvents(dateStr)};if(dObj.getDate()===new Date().getDate()&&month===new Date().getMonth()&&year===new Date().getFullYear())cell.classList.add('today');if(dayEvents.some(e=>e.selected))cell.classList.add('selected');if(dayEvents.length>0){const ev=document.createElement('div');ev.className='event-indicator';cell.appendChild(ev)}container.appendChild(cell)}}
function renderEvents(dateStr){const list=document.getElementById('eventList');const dayEvents=loadEvents(dateStr);const empty=document.querySelector('.event-list-empty');if(dayEvents.length===0){if(empty&&!empty.parentNode.classList.contains('event-list'))empty.parentNode.removeChild(empty);empty.style.display='block';return}if(empty&&empty.parentNode.classList.contains('event-list'))empty.parentNode.removeChild(empty);empty.style.display='none';list.innerHTML=dayEvents.map((e,i)=>`<div class="event-item"><span class="event-time">${e.time||'전체_day'}</span><span>${e.title}</span></div>`).join('')}
function prevMonth(){currentDate.setMonth(currentDate.getMonth()-1);renderCalendar();renderEvents(formatDate(currentDate))}
function nextMonth(){currentDate.setMonth(currentDate.getMonth()+1);renderCalendar();renderEvents(formatDate(currentDate))}
function selectDate(d){// 시각적 선택 토글
  const cells=document.querySelectorAll('.day-cell');cells.forEach(c=>c.classList.remove('selected'));const cell=document.querySelector(`.day-cell:contains(${d.getDate()})`);if(cell)cell.classList.add('selected')
}
function addEvent(){const dateInput=document.getElementById('eventDate').value;const timeSelect=document.getElementById('eventTime').value;const titleInput=document.getElementById('eventTitle').value;if(!dateInput||!titleInput)return;events.push({date:dateInput,time:timeSelect||'전체',title:titleInput,selected:false});saveEvents();renderCalendar();renderEvents(formatDate(new Date()));document.getElementById('eventTitle').value=''}
renderCalendar();renderEvents(formatDate(new Date()))
</script>
</body>
</html>
