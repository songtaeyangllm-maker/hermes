<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII Art Studio</title>
<style>
:root { --bg:#0b0e16; --text:#e5e7eb; --muted:#6b7686; --card:#121826; --border:#1e2840; --accent:#4ade80; }
*{ margin:0; padding:0; box-sizing:border-box; }
body{ background:var(--bg); color:var(--text); font-family:'Segoe UI',sans-serif; display:flex; flex-direction:column; align-items:center; gap:14px; padding:16px; }
h1{ font-size:20px; letter-spacing:2px; } h1 span{ color:var(--accent); }
.sub{ color:var(--muted); font-size:12px; }
.tabs{ display:flex; gap:8px; } .tab{ background:#16223a; border:1px solid var(--border); border-radius:8px; padding:8px 18px; cursor:pointer; font-size:13px; color:var(--muted); } .tab.on{ color:var(--text); border-color:var(--accent); background:#1f3050; }
.view{ display:none; width:100%; max-width:760px; } .view.on{ display:block; }
.controls{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
input[type=text]{ background:#0d1322; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px 12px; font-size:14px; flex:1; min-width:160px; }
select,input[type=range]{ background:#0d1322; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:6px; }
.btn{ background:#16223a; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px 16px; cursor:pointer; font-size:13px; }
.btn:hover{ background:#1f3050; } .btn.acc{ background:var(--accent); color:#0b0e16; font-weight:bold; }
.out{ background:#0a0e16; border:1px solid var(--border); border-radius:10px; padding:16px; overflow:auto; max-height:460px; min-height:200px; font-family:Consolas,'Courier New',monospace; font-size:8px; line-height:1.05; white-space:pre; color:var(--text); }
.out.colored span{ display:inline-block; }
.mono{ white-space:pre; font-family:Consolas,monospace; font-size:8px; line-height:1; }
#imgInput{ display:none; }
.fileLabel{ background:#16223a; border:1px solid var(--border); border-radius:8px; padding:8px 16px; cursor:pointer; font-size:13px; }
.hint{ color:var(--muted); font-size:11px; margin-top:6px; }
</style>
</head>
<body>
<h1>ASCII <span>::</span> ART STUDIO</h1>
<div class="sub">텍스트 배너 · 이미지 → ASCII 변환</div>
<div class="tabs"><div class="tab on" data-v="text">🔤 텍스트</div><div class="tab" data-v="img">🖼️ 이미지</div></div>

<div class="view on" id="v-text">
  <div class="controls">
    <input type="text" id="txt" value="HERMES 2026" placeholder="텍스트 입력">
    <select id="fontSel">
      <option value="block">█ 블록</option>
      <option value="dot">● 도트</option>
      <option value="ascii"># 해시</option>
      <option value="shade">▒ 셰이드</option>
      <option value="star">★ 별</option>
    </select>
    <button class="btn acc" id="genTxt">🎨 생성</button>
    <button class="btn" id="copyTxt">📋 복사</button>
  </div>
  <div class="out mono" id="txtOut">HERMES 2026</div>
  <div class="hint">5×5 도트 폰트 · 대문자/숫자/공백 지원 · 셰이드는 더 큰 캐릭터</div>
</div>

<div class="view" id="v-img">
  <div class="controls">
    <label class="fileLabel" for="imgInput">📁 이미지 선택</label>
    <select id="charSet">
      <option value="dense">@%#*+=-:. (다크→라이트)</option>
      <option value="block2">█▓▒░ (블록)</option>
      <option value="chars">█▓▒░@%#=+*:,. (세밀)</option>
    </select>
    <label>너비 <input type="range" id="width" min="40" max="160" value="100"></label>
    <label>명암 <input type="range" id="contrast" min="50" max="200" value="100"></label>
    <button class="btn acc" id="genImg">🔄 변환</button>
    <button class="btn" id="copyImg">📋 복사</button>
  </div>
  <div class="out" id="imgOut">이미지를 선택하면 ASCII로 변환됩니다</div>
  <div class="hint">실제 이미지 크기 제한 없음 · 밝기 → 램프 매핑</div>
</div>

<script>
// ======== 5x5 도트 폰트 (A-Z, 0-9, space) ========
const F5={
 A:['01110','10001','11111','10001','10001'],B:['11110','10001','11110','10001','11110'],C:['01111','10000','10000','10000','01111'],
 D:['11110','10001','10001','10001','11110'],E:['11111','10000','11110','10000','11111'],F:['11111','10000','11110','10000','10000'],
 G:['01111','10000','10111','10001','01111'],H:['10001','10001','11111','10001','10001'],I:['11111','00100','00100','00100','11111'],
 J:['00111','00010','00010','10010','01100'],K:['10001','10010','11100','10010','10001'],L:['10000','10000','10000','10000','11111'],
 M:['10001','11011','10101','10101','10001'],N:['10001','11001','10101','10011','10001'],O:['01110','10001','10001','10001','01110'],
 P:['11110','10001','11110','10000','10000'],Q:['01110','10001','10001','10010','01101'],R:['11110','10001','11110','10010','10001'],
 S:['01111','10000','01110','00001','11110'],T:['11111','00100','00100','00100','00100'],U:['10001','10001','10001','10001','01110'],
 V:['10001','10001','10001','01010','00100'],W:['10001','10101','10101','11011','10001'],X:['10001','01010','00100','01010','10001'],
 Y:['10001','01010','00100','00100','00100'],Z:['11111','00010','00100','01000','11111'],
 '0':['01110','10011','10101','11001','01110'],'1':['00100','01100','00100','00100','01110'],'2':['01110','10001','00110','01000','11111'],
 '3':['11110','00001','01110','00001','11110'],'4':['10010','10010','11111','00010','00010'],'5':['11111','10000','11110','00001','11110'],
 '6':['01110','10000','11110','10001','01110'],'7':['11111','00010','00100','01000','01000'],'8':['01110','10001','01110','10001','01110'],
 '9':['01110','10001','01111','00001','01110'],' ':['00000','00000','00000','00000','00000'],'!':['00100','00100','00100','00000','00100']
};
const FILL={ block:'█', dot:'●', ascii:'#', shade:'▒', star:'★' };
function genText(){
  const txt=document.getElementById('txt').value.toUpperCase();
  const style=document.getElementById('fontSel').value;
  const fill=FILL[style]; if(!txt)return;
  // 5행 조립
  let lines=['','','','',''];
  for(const ch of txt){ const g=F5[ch]||F5[' ']; for(let r=0;r<5;r++){ lines[r]+=g[r].split('').map(c=>c==='1'?fill:' ').join(''); lines[r]+=' '; } }
  // 셰이드는 2x 확대 느낌 (글자가 크긴 하나)
  document.getElementById('txtOut').textContent=lines.join('\n');
}
document.getElementById('genTxt').onclick=genText;
document.getElementById('copyTxt').onclick=()=>navigator.clipboard.writeText(document.getElementById('txtOut').textContent).then(()=>{const b=document.getElementById('copyTxt');b.textContent='✅ 복사됨';setTimeout(()=>b.textContent='📋 복사',1200);});
document.getElementById('txt').addEventListener('keydown',e=>{if(e.key==='Enter')genText();});
// ======== 이미지 → ASCII ========
let imgData=null;
document.getElementById('imgInput').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f)return;
  const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); c.width=img.width; c.height=img.height; const ctx=c.getContext('2d'); ctx.drawImage(img,0,0); try{ imgData=ctx.getImageData(0,0,c.width,c.height); genImg(); }catch(err){ document.getElementById('imgOut').textContent='⚠️ 이미지 로드 실패 (CORS?)'; } }; img.src=URL.createObjectURL(f);
});
function genImg(){ if(!imgData){ document.getElementById('imgOut').textContent='먼저 이미지를 선택하세요'; return; }
  const charset=document.getElementById('charSet').value;
  const map = charset==='dense' ? '@%#*+=-:.'.split('') : charset==='block2' ? '█▓▒░'.split('') : '█▓▒░@%#=+*:,. '.split('');
  const W=+document.getElementById('width').value, contrast=+document.getElementById('contrast').value/100;
  const H=Math.round(W * imgData.height/imgData.width * 0.5);
  const sw=imgData.width/W, sh=imgData.height/H;
  let out='';
  for(let y=0;y<H;y++){ for(let x=0;x<W;x++){ const px=Math.floor(x*sw), py=Math.floor(y*sh); const i=(py*imgData.width+px)*4; const r=imgData.data[i],g=imgData.data[i+1],b=imgData.data[i+2]; const luma=(0.299*r+0.587*g+0.114*b)/255; const v=Math.max(0,Math.min(1,luma*contrast)); const idx=Math.floor((1-v)*(map.length-1)); out+=map[idx]; } out+='\n'; }
  document.getElementById('imgOut').textContent=out;
}
document.getElementById('genImg').onclick=genImg;
document.getElementById('copyImg').onclick=()=>navigator.clipboard.writeText(document.getElementById('imgOut').textContent).then(()=>{const b=document.getElementById('copyImg');b.textContent='✅ 복사됨';setTimeout(()=>b.textContent='📋 복사',1200);});
['width','contrast'].forEach(id=>document.getElementById(id).addEventListener('input',genImg));
// ======== 탭 ========
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on')); t.classList.add('on'); document.querySelectorAll('.view').forEach(v=>v.classList.remove('on')); document.getElementById('v-'+t.dataset.v).classList.add('on'); });
genText();
</script>
</body>
</html>
