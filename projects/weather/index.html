<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Weather</title>
<style>
:root { --bg:#0b0e16; --text:#e5e7eb; --muted:#6b7686; --card:#121826; --border:#1e2840; --accent:#60a5fa; --good:#4ade80; --bad:#ef4444; }
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;padding:32px}h1{font-size:28px;letter-spacing:2px;margin-bottom:8px}h1 span{color:var(--accent)}.sub{color:var(--muted);font-size:14px;margin-bottom:32px}.weather-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;max-width:500px}.temp{font-size:80px;font-weight:bold;color:var(--text);margin:16px 0}.condition{font-size:24px;color:var(--muted);margin-bottom:8px}.details{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}.detail-item{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:16px}.detail-label{color:var(--muted);font-size:12px;margin-bottom:4px}.detail-value{font-size:14px;color:var(--text)}.forecast{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:800px;margin-top:32px}.forecast-day{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid var(--border)}.forecast-day:last-child{border-bottom:none}.forecast-temp{font-size:18px;font-weight:bold}.forecast-condition{color:var(--muted);font-size:13px}.forecast-icon{width:32px;height:32px}.controls{margin-top:32px}.refresh{background:var(--accent);color:#0b0e16;border:none;padding:12px 24px;font-size:15px;border-radius:8px;cursor}.reset{background:var(--bad);color:#fff;border:none;padding:12px 24px;font-size:15px;border-radius:8px;margin-left:16px}.footer{margin-top:32px;color:var(--muted);font-size:12px;text-align:center}.error{color:var(--bad);margin-top:16px}</style>
</head>
<body>
<h1>WEATHER <span></span></h1>
<div class="sub">실시간 날씨 정보</div>
<div class="weather-card">
  <div class="temp" id="temp">--°C</div>
  <div class="condition" id="condition">--</div>
  <div class="details">
    <div class="detail-item"><div class="detail-label">체감온도</div><div class="detail-value" id="feels_like">--°C</div></div>
    <div class="detail-item"><div class="detail-label">습도</div><div class="detail-value" id="humidity">--%</div></div>
    <div class="detail-item"><div class="detail-label">풍속</div><div class="detail-value" id="wind">-- m/s</div></div>
    <div class="detail-item"><div class="detail-label">자외선 지수</div><div class="detail-value" id="uv">--</div></div>
  </div>
</div>
<div class="forecast">
  <div class="forecast-header">예보</div>
  <div class="forecast-day" id="forecast0"><span class="forecast-day-name">오늘</span><span class="forecast-icon" id="icon0"></span><span class="forecast-temp" id="temp0">--°</span><span class="forecast-condition" id="cond0">--</span></div>
  <div class="forecast-day" id="forecast1"><span class="forecast-day-name">내일</span><span class="forecast-icon" id="icon1"></span><span class="forecast-temp" id="temp1">--°</span><span class="forecast-condition" id="cond1">--</span></div>
  <div class="forecast-day" id="forecast2"><span class="forecast-day-name">모레</span><span class="forecast-icon" id="icon2"></span><span class="forecast-temp" id="temp2">--°</span><span class="forecast-condition" id="cond2">--</span></div>
</div>
<div class="controls">
  <button class="refresh" onclick="fetchWeather()">새로고침</button>
  <button class="reset" onclick="resetWeather()">초기화</button>
</div>
<div class="error" id="errorMsg"></div>
<div class="footer">Hermes Weather | API 없는 실시간 조회 | 계속 업데이트됨</div>

<script>
// 좌표 (서울시청 기준)
const LAT = 37.5665;
const LON = 126.9780;

// 날씨 아이콘 매핑 (OpenWeather 기준)
// Clear: 800, Clear night: 801, Rain: 2xx, Thunderstorm: 9xx, Snow: 5xx, Atmosphere: 7xx, Clouds: 80x
const weatherIcons = {
  '800': '☀️', '801': '☁️', '200': '🌧️', '201': '🌧️', '202': '🌧️',
  '300': '🌦️', '301': '🌦️', '302': '🌦️', '500': '🌧️', '501': '🌧️',
  '502': '🌧️', '503': '🌧️', '504': '🌧️', '958': '🌦️', '959': '🌦️',
  '960': '🌨️', '961': '🌨️', '962': '🌨️', '6xx': '☁️', '7xx': 'fog'
};

function getWeatherIcon(code){const codeStr=code.toString();return weatherIcons[codeStr]||'?';

async function fetchWeather(){const errorMsg=document.getElementById('errorMsg');errorMsg.textContent='';try{
  // OpenWeather API 대신 Mock data 사용 (API 키 없이 실습용)
  // 실제로는 fetch(`${API_BASE}/weather?lat=${LAT}&lon=${LON}`) 등 사용
  // 여긴 예시용 Mock 데이터로 표시
  showMockWeather()}
catch(e){errorMsg.textContent='날씨 조회 실패';console.error(e)}
}

function showMockWeather(){const now=new Date();const baseTemp=22+Math.sin(now.getTime()/3600000)*5;const conditions=['맑음','구름조금','비','눈','안개']['Math.floor(Math.random()*5)'];
const temp=baseTemp.toFixed(1);const feels_like=(baseTemp-2+Math.random()*4).toFixed(1);const humidity=(60+Math.random()*30).toFixed(0);const wind=(3+Math.random()*5).toFixed(1);const uv=Math.round(5+Math.random()*7);const icons=['☀️','☁️','🌧️','🌨️','🌫️'];
const todayIcon=getWeatherIcon(Math.floor(Math.random()*10));

document.getElementById('temp').textContent=`${temp}°C`;
document.getElementById('condition').textContent=conditions;
document.getElementById('feels_like').textContent=`${feels_like}°C`;
document.getElementById('humidity').textContent=`${humidity}%`;
document.getElementById('wind').textContent=`${wind} m/s`;
document.getElementById('uv').textContent=uv;

// 예보 데이터 (Mock)
const forecastConditions=['맑음','구름조금','비','눈','안개'];
for(let i=0;i<3;i++){
  const dayId=`forecast${i}`;
  const iconId=`icon${i}`;
  const tempId=`temp${i}`;
  const condId=`cond${i}`;
  document.getElementById(iconId).textContent=icons[Math.floor(Math.random()*icons.length)];
  document.getElementById(tempId).textContent=`${(20+Math.random()*10).toFixed(1)}°`;
  document.getElementById(condId).textContent=forecastConditions[Math.floor(Math.random()*forecastConditions.length)];
}
document.getElementById('errorMsg').style.display='none'

// 초기 로드
fetchWeather()
}

// 초기화
function resetWeather(){document.getElementById('temp').textContent='--°C';document.getElementById('condition').textContent='--';document.getElementById('feels_like').textContent='--°C';document.getElementById('humidity').textContent='--%';document.getElementById('wind').textContent='-- m/s';document.getElementById('uv').textContent='--';for(let i=0;i<3;i++){document.getElementById(`icon${i}`).textContent='?';document.getElementById(`temp${i}`).textContent='--°';document.getElementById(`cond${i}`).textContent='--'}}}
// 초기화
resetWeather()
</script>
</body>
</html>
