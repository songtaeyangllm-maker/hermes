<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes QR Code Generator</title>
<style>
:root{--bg:#0b0e16;--text:#e5e7eb;--muted:#6b7686;--card:#121826;--border:#1e2840;--accent:#60a5fa;--good:#4ade80;--bad:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;padding:32px}h1{font-size:28px;letter-spacing:2px;margin-bottom:8px}h1 span{color:var(--accent)}.sub{color:var(--muted);font-size:14px;margin-bottom:32px}.generator{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;max-width=600px}.input-group{margin-bottom:24px}.input-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px;text-transform:uppercase}.input-group textarea,.input-group input,.input-group select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:12px;border-radius:8px;font-size:14px;font-family:inherit}.input-group textarea{height:120px;resize:vertical}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}.option{background:var(--bg);border:1px solid var(--border);padding:12px;border-radius:8px}.option label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.option input,.option select{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:4px;font-size:13px}.preview{display:flex;justify-content:center;align-items:center;min-height:300px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-bottom:24px;position:relative}#qrCanvas{display:block}#qrImage{display:none;max-width:100%;max-height:300px}.btn-row{display:flex;gap:12px;justify-content:center}.btn{background:var(--accent);color:#0b0e16;border:none;padding:12px 24px;font-size:14px;border-radius:6px;cursor:pointer}.btn:hover{opacity:.9}.btn.secondary{background:var(--border);color:var(--text)}.footer{margin-top:32px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<h1>QR CODE <span>GENERATOR</span></h1>
<div class="sub">QR 코드 생성기 — 텍스트/URL/연락처/WiFi 등 지원</div>
<div class="generator">
  <div class="input-group">
    <label>내용</label>
    <textarea id="content" placeholder="https://example.com 또는 텍스트 입력"></textarea>
  </div>
  
  <div class="options">
    <div class="option">
      <label>타입</label>
      <select id="qrType" onchange="updatePlaceholder()">
        <option value="text">텍스트/URL</option>
        <option value="url">웹사이트 URL</option>
        <option value="email">이메일</option>
        <option value="phone">전화번호</option>
        <option value="sms">SMS</option>
        <option value="wifi">WiFi 설정</option>
        <option value="vcard">연락처 (vCard)</option>
        <option value="geo">위치 정보</option>
      </select>
    </div>
    <div class="option">
      <label>크기 (px)</label>
      <input type="number" id="qrSize" value="256" min="100" max="1024" step="32" oninput="generate()">
    </div>
    <div class="option">
      <label>여백</label>
      <input type="number" id="qrMargin" value="4" min="0" max="20" oninput="generate()">
    </div>
    <div class="option">
      <label>오류 복구</label>
      <select id="qrLevel" onchange="generate()">
        <option value="L">L (7%)</option>
        <option value="M" selected>M (15%)</option>
        <option value="Q">Q (25%)</option>
        <option value="H">H (30%)</option>
      </select>
    </div>
    <div class="option">
      <label>전경색</label>
      <input type="color" id="qrFg" value="#000000" oninput="generate()">
    </div>
    <div class="option">
      <label>배경색</label>
      <input type="color" id="qrBg" value="#ffffff" oninput="generate()">
    </div>
  </div>
  
  <div class="preview" id="preview">
    <canvas id="qrCanvas"></canvas>
    <img id="qrImage" alt="QR 코드">
  </div>
  
  <div class="btn-row">
    <button class="btn" onclick="downloadPNG()">PNG 다운로드</button>
    <button class="btn secondary" onclick="downloadSVG()">SVG 다운로드</button>
    <button class="btn secondary" onclick="copyImage()">이미지 복사</button>
  </div>
</div>
<div class="footer">Hermes QR Code Generator | QRCode.js 라이브러리 | 계속 업데이트됨</div>

<script>
// QRCode.js 로드
const loadQR=()=>new Promise(r=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js';s.onload=r;document.head.appendChild(s)});

const canvas=document.getElementById('qrCanvas');
const img=document.getElementById('qrImage');
let qrCode=null;

async function init(){
  await loadQR();
  generate();
}

function updatePlaceholder(){
  const type=document.getElementById('qrType').value;
  const ph={
    text:'텍스트 또는 URL을 입력하세요',
    url:'https://example.com',
    email:'mailto:user@example.com?subject=안녕&body=내용',
    phone:'tel:+821012345678',
    sms:'sms:+821012345678?body=메시지',
    wifi:'WIFI:T:WPA;S:MyNetwork;P:password123;;',
    vcard:'BEGIN:VCARD\nVERSION:3.0\nFN:홍길동\nTEL:+821012345678\nEMAIL:hong@example.com\nEND:VCARD',
    geo:'geo:37.5665,126.9780'
  };
  document.getElementById('content').placeholder=ph[type]||'';
}

function generate(){
  const text=document.getElementById('content').value.trim();
  const size=parseInt(document.getElementById('qrSize').value);
  const margin=parseInt(document.getElementById('qrMargin').value);
  const level=document.getElementById('qrLevel').value;
  const fg=document.getElementById('qrFg').value;
  const bg=document.getElementById('qrBg').value;
  
  if(!text){
    canvas.style.display='none';
    img.style.display='none';
    return;
  }
  
  if(qrCode)qrCode.clear();
  
  qrCode=new QRCode(canvas,{
    text:text,
    width:size,
    height:size,
    colorDark:fg,
    colorLight:bg,
    correctLevel:QRCode.CorrectLevel[level]
  });
  
  canvas.style.display='block';
  img.style.display='none';
}

function downloadPNG(){
  if(!qrCode)return;
  const link=document.createElement('a');
  link.href=canvas.toDataURL('image/png');
  link.download='qrcode.png';
  link.click();
}

function downloadSVG(){
  const text=document.getElementById('content').value.trim();
  if(!text)return;
  // 간단한 SVG 생성 (QRCode.js는 SVG 직접 지원 안함)
  alert('SVG 내보내기는 별도 구현 필요. PNG를 사용하세요.');
}

async function copyImage(){
  if(!qrCode)return;
  try{
    canvas.toBlob(async blob=>{
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      alert('이미지 복사 완료');
    });
  }catch(e){
    alert('복사 실패: '+e.message);
  }
}

document.getElementById('content').addEventListener('input',generate);
document.getElementById('qrSize').addEventListener('input',generate);
document.getElementById('qrMargin').addEventListener('input',generate);
document.getElementById('qrLevel').addEventListener('change',generate);
document.getElementById('qrFg').addEventListener('input',generate);
document.getElementById('qrBg').addEventListener('input',generate);

init();
</script>
</body>
</html>
