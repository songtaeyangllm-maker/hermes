<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes 2048</title>
<style>
:root { --bg:#0b0b12; --board:#14141f; --cell:#1c1c2a; --text:#ececf5; --muted:#6b6f82; --accent:#7c5cff; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,'Segoe UI','Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
h1 { font-size:1.4rem; font-weight:800; letter-spacing:1px; }
h1 span { color:var(--accent); }
.sub { font-size:0.78rem; color:var(--muted); margin-bottom:20px; }

.scorebar { display:flex; gap:14px; margin-bottom:18px; }
.scorebox { background:#14141f; border:1px solid #23233a; border-radius:14px; padding:10px 22px; text-align:center; min-width:110px; }
.scorebox .l { font-size:0.65rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
.scorebox .v { font-size:1.4rem; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums; }

.board { position:relative; display:grid; grid-template-columns:repeat(4,1fr); gap:10px; background:var(--board); border:1px solid var(--border,#23233a); border-radius:20px; padding:12px; width:min(92vw,420px); aspect-ratio:1; }
.cell { background:var(--cell); border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:2rem; transition:background 0.15s, transform 0.15s; }
.cell span { transition:font-size 0.15s; }
.cell-2 { background:#22334a; color:#dbe8ff; } .cell-4 { background:#2f3d6e; color:#e4ecff; }
.cell-8 { background:#4053a8; color:#fff; } .cell-16 { background:#5c4fb8; color:#fff; }
.cell-32 { background:#7c5cff; color:#fff; } .cell-64 { background:#ac4fd8; color:#fff; }
.cell-128 { background:#ff6b6b; color:#fff; } .cell-256 { background:#ff9d6b; color:#fff; }
.cell-512 { background:#ffd166; color:#3a2c12; } .cell-1024 { background:#5ce6a8; color:#0a2e1e; }
.cell-2048 { background:#fafafa; color:#111; }
.cell-4096 { background:#ffd700; color:#222; }

.overlay { position:absolute; inset:0; background:rgba(8,8,14,0.88); border-radius:20px; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; backdrop-filter:blur(4px); }
.overlay.show { display:flex; }
.overlay h2 { font-size:1.6rem; font-weight:800; }
.overlay p { color:var(--muted); font-size:0.85rem; }
.btns { display:flex; gap:10px; margin-top:6px; }
.btn { padding:12px 26px; border-radius:30px; border:none; font-size:0.9rem; font-weight:700; cursor:pointer; transition:all .2s; }
.btn-primary { background:var(--accent); color:#fff; } .btn-primary:hover { filter:brightness(1.15); }
.btn-ghost { background:transparent; border:1.5px solid #3a3a55; color:var(--text); }

.hint { margin-top:16px; color:var(--muted); font-size:0.72rem; text-align:center; line-height:1.6; }
.kbd { display:inline-block; padding:2px 7px; border-radius:6px; background:#1c1c2a; border:1px solid #2c2c40; font-size:0.7rem; margin:0 2px; }
</style>
</head>
<body>
    <h1>🔢 <span>2048</span></h1>
    <div class="sub">타일을 합쳐 2048에 도달하세요</div>

    <div class="scorebar">
        <div class="scorebox"><div class="l">점수</div><div class="v" id="score">0</div></div>
        <div class="scorebox"><div class="l">최고</div><div class="v" id="best">0</div></div>
    </div>

    <div class="board" id="board">
        <div class="overlay" id="overlay">
            <h2 id="overTitle">게임 오버!</h2>
            <p id="overMsg">다시 도전해보세요</p>
            <div class="btns">
                <button class="btn btn-primary" onclick="restart()">↺ 다시 시작</button>
                <button class="btn btn-ghost" onclick="closeOverlay()">계속 보기</button>
            </div>
        </div>
    </div>

    <div class="hint">
        <span class="kbd">←</span><span class="kbd">↑</span><span class="kbd">→</span><span class="kbd">↓</span> 또는
        <span class="kbd">W</span><span class="kbd">A</span><span class="kbd">S</span><span class="kbd">D</span> 로 이동 ·
        모바일은 스와이프
    </div>

<script>
const SIZE = 4;
let grid = [];
let score = 0;
let best = parseInt(localStorage.getItem('best2048') || '0');
document.getElementById('best').textContent = best;
let touchX=0, touchY=0;

function emptyGrid(){ return Array.from({length:SIZE},()=>Array(SIZE).fill(0)); }
function newTile(){
    const empty=[];
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++) if(grid[r][c]===0) empty.push([r,c]);
    if(!empty.length) return;
    const [r,c]=empty[Math.floor(Math.random()*empty.length)];
    grid[r][c]=Math.random()<0.9?2:4;
}
function init(){ grid=emptyGrid(); score=0; document.getElementById('score').textContent=0; newTile(); newTile(); render(); }

function render(){
    const board=document.getElementById('board');
    board.querySelectorAll('.cell').forEach(el=>el.remove());
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
        const v=grid[r][c];
        const el=document.createElement('div');
        el.className='cell'+(v?' cell-'+v:'');
        if(v){ el.innerHTML=`<span>${v}</span>`; if(v>=100) el.querySelector('span').style.fontSize='1.5rem'; if(v>=1000) el.querySelector('span').style.fontSize='1.1rem'; }
        board.appendChild(el);
    }
}

function compress(row){
    const nz=row.filter(x=>x!==0);
    const merged=[];
    let skip=false;
    for(let i=0;i<nz.length;i++){
        if(skip){ skip=false; continue; }
        if(i+1<nz.length && nz[i]===nz[i+1]){ merged.push(nz[i]*2); score+=nz[i]*2; skip=true; }
        else merged.push(nz[i]);
    }
    while(merged.length<SIZE) merged.push(0);
    return merged;
}

function move(dir){
    // dir: 0=left,1=up,2=right,3=down
    const before=JSON.stringify(grid);
    const rotated=[];
    for(let row of grid) rotated.push([...row]);
    // normalize: rotate so target direction becomes "left"
    const normalize=()=>{
        let g=grid.map(r=>[...r]);
        if(dir===1||dir===3){ // up/down -> transpose
            g=Array.from({length:SIZE},(_,i)=>Array.from({length:SIZE},(_,j)=>grid[j][i]));
        }
        if(dir===2||dir===3){ // right/down -> reverse rows
            g=g.map(r=>r.slice().reverse());
        }
        return g;
    };
    const normalized=normalize();
    const result=normalized.map(row=>compress(row));
    // un-normalize
    let out=result;
    if(dir===2||dir===3) out=out.map(r=>r.slice().reverse());
    if(dir===1||dir===3) out=Array.from({length:SIZE},(_,i)=>Array.from({length:SIZE},(_,j)=>out[j][i]));
    grid=out;
    document.getElementById('score').textContent=score;
    updateBest();
    if(JSON.stringify(grid)!==before){ newTile(); render(); checkState(); }
    else { render(); checkState(); }
}

function updateBest(){
    if(score>best){ best=score; localStorage.setItem('best2048',String(best)); document.getElementById('best').textContent=best; }
}

function checkState(){
    // win
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++) if(grid[r][c]===2048){ showOverlay('🎉 승리!', '2048에 도달했어요!'); return; }
    // game over: any empty or any adjacent equal?
    let over=true;
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
        if(grid[r][c]===0){ over=false; break; }
        if(c+1<SIZE && grid[r][c]===grid[r][c+1]) over=false;
        if(r+1<SIZE && grid[r][c]===grid[r+1][c]) over=false;
        if(!over) break;
    }
    if(over){ showOverlay('게임 오버!', '점수 '+score+'점 · 다시 도전!'); }
}
function showOverlay(t,m){ document.getElementById('overTitle').textContent=t; document.getElementById('overMsg').textContent=m; document.getElementById('overlay').classList.add('show'); }
function closeOverlay(){ document.getElementById('overlay').classList.remove('show'); }
function restart(){ document.getElementById('overlay').classList.remove('show'); init(); }

// keyboard
document.addEventListener('keydown',e=>{
    const map={ArrowLeft:0,ArrowUp:1,ArrowRight:2,ArrowDown:3,a:0,w:1,d:2,s:3,A:0,W:1,D:2,S:3};
    if(map[e.key]!==undefined){ e.preventDefault(); move(map[e.key]); }
});
// touch
document.addEventListener('touchstart',e=>{ touchX=e.touches[0].clientX; touchY=e.touches[0].clientY; },{passive:true});
document.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-touchX, dy=e.changedTouches[0].clientY-touchY;
    if(Math.max(Math.abs(dx),Math.abs(dy))<30) return;
    if(Math.abs(dx)>Math.abs(dy)) move(dx>0?2:0);
    else move(dy>0?3:1);
},{passive:true});

init();
</script>
</body>
</html>
