<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Snake</title>
<style>
    :root {
        --bg:#0b0b12; --card:#13131c; --text:#ececf5; --muted:#6b6f82;
        --border:#23233a; --accent:#7c5cff;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,'Segoe UI','Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:30px 20px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:24px; padding:28px 30px; text-align:center; max-width:520px; width:100%; }
    .title { font-size:1.5rem; font-weight:800; margin-bottom:4px; letter-spacing:1px; }
    .title span { color:var(--accent); }

    .hud { display:flex; justify-content:space-between; align-items:center; margin:18px 0 12px; }
    .score-box { background:rgba(124,92,255,0.1); border:1px solid var(--border); border-radius:14px; padding:8px 18px; }
    .score-label { font-size:0.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
    .score-val { font-size:1.6rem; font-weight:800; color:var(--accent); }

    canvas {
        background:#0d0d17; border:1px solid var(--border); border-radius:16px;
        display:block; margin:0 auto; max-width:100%;
    }

    .controls { display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
    .btn { background:var(--accent); color:#fff; border:none; cursor:pointer; padding:10px 20px; border-radius:12px; font-size:0.9rem; font-weight:700; transition:transform 0.15s, opacity 0.2s; }
    .btn:hover { transform:translateY(-2px); opacity:0.9; }
    .btn.ghost { background:transparent; border:1px solid var(--border); color:var(--text); }

    .settings { display:flex; gap:12px; justify-content:center; align-items:center; margin-top:14px; flex-wrap:wrap; font-size:0.8rem; color:var(--muted); }
    .settings select, .settings input {
        background:#0d0d17; color:var(--text); border:1px solid var(--border);
        border-radius:8px; padding:5px 10px; font-size:0.8rem;
    }

    .msg { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:1.4rem; font-weight:800; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,0.6); pointer-events:none; }
    .wrap { position:relative; display:inline-block; }

    .arrows { display:grid; grid-template-columns:repeat(3,56px); gap:6px; justify-content:center; margin-top:16px; }
    .arrows button { height:50px; border-radius:12px; background:#0d0d17; border:1px solid var(--border); color:var(--text); font-size:1.3rem; cursor:pointer; touch-action:none; }
    .arrows button:hover { background:rgba(124,92,255,0.2); }
    .a-up { grid-column:2; }
    .a-left { grid-column:1; }
    .a-right { grid-column:3; }
    .a-down { grid-column:2; }
    .hint { margin-top:14px; font-size:0.75rem; color:var(--muted); }
</style>
</head>
<body>
<div class="card">
    <div class="title">🐍 <span>HERMES</span> SNAKE</div>
    <div class="hud">
        <div class="score-box"><div class="score-label">Score</div><div class="score-val" id="score">0</div></div>
        <div class="score-box"><div class="score-label">Best</div><div class="score-val" id="best">0</div></div>
    </div>

    <div class="wrap">
        <canvas id="game" width="480" height="480"></canvas>
        <div class="msg" id="msg" style="display:none">READY</div>
    </div>

    <div class="controls">
        <button class="btn" id="btnStart" onclick="toggle()">▶️ 시작</button>
        <button class="btn ghost" onclick="resetGame()">🔄 리셋</button>
    </div>

    <div class="settings">
        <label>속도 <select id="speed" onchange="applySpeed()">
            <option value="150">느림</option>
            <option value="110" selected>보통</option>
            <option value="75">빠름</option>
            <option value="50">초고속</option>
        </select></label>
        <label>테마 <select id="theme" onchange="applyTheme()">
            <option value="neon" selected>네온</option>
            <option value="ocean">오션</option>
            <option value="sunset">선셋</option>
            <option value="forest">포레스트</option>
        </select></label>
    </div>

    <div class="arrows">
        <span></span><button class="a-up" onclick="setDir('up')">▲</button><span></span>
        <button class="a-left" onclick="setDir('left')">◀</button><button class="a-down" onclick="setDir('down')">▼</button><button class="a-right" onclick="setDir('right')">▶</button>
    </div>
    <div class="hint">방향키/화면 터치로 조작 · 먹으면 길어짐 💫</div>
</div>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const CELL = 24;
    const COLS = canvas.width / CELL;
    const ROWS = canvas.height / CELL;

    const THEMES = {
        neon:    { head:'#b39cff', body:'#7c5cff', food:'#ff7c9e', grid:'#1a1a28' },
        ocean:   { head:'#5cd6ff', body:'#2a9d8f', food:'#ffd93d', grid:'#0d2233' },
        sunset:  { head:'#ff8a5c', body:'#ff6b6b', food:'#ffd93d', grid:'#2b1a24' },
        forest:  { head:'#5ce6a8', body:'#2ee6a8', food:'#ffcf5c', grid:'#0f2418' },
    };

    let snake, dir, nextDir, food, score, best, running, gameOver, loop;
    best = parseInt(localStorage.getItem('snake-best') || '0');
    document.getElementById('best').textContent = best;

    function resetGame() {
        snake = [{x:Math.floor(COLS/2), y:Math.floor(ROWS/2)}];
        dir = {x:1, y:0}; nextDir = dir;
        score = 0; running = false; gameOver = false;
        clearInterval(loop);
        document.getElementById('score').textContent = '0';
        placeFood();
        draw();
        document.getElementById('msg').style.display = 'none';
        document.getElementById('btnStart').textContent = '▶️ 시작';
    }

    function placeFood() {
        let ok = false;
        while (!ok) {
            food = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) };
            ok = !snake.some(s => s.x===food.x && s.y===food.y);
        }
    }

    function draw() {
        const t = THEMES[document.getElementById('theme').value] || THEMES.neon;
        ctx.fillStyle = '#0d0d17';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        // grid
        ctx.strokeStyle = t.grid; ctx.lineWidth = 1;
        for (let i=1;i<COLS;i++){ ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,canvas.height); ctx.stroke(); }
        for (let j=1;j<ROWS;j++){ ctx.beginPath(); ctx.moveTo(0,j*CELL); ctx.lineTo(canvas.width,j*CELL); ctx.stroke(); }
        // food (pulse)
        const pulse = 1 + 0.1*Math.sin(Date.now()/180);
        ctx.fillStyle = t.food;
        ctx.shadowColor = t.food; ctx.shadowBlur = 14;
        ctx.beginPath(); ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, (CELL/2-2)*pulse,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
        // snake
        snake.forEach((s, i) => {
            const isHead = i === 0;
            ctx.fillStyle = isHead ? t.head : t.body;
            ctx.shadowColor = isHead ? t.head : t.body;
            ctx.shadowBlur = isHead ? 10 : 6;
            const r = CELL/2 - 3;
            ctx.beginPath();
            ctx.roundRect(s.x*CELL+3, s.y*CELL+3, CELL-6, CELL-6, r);
            ctx.fill();
        });
        ctx.shadowBlur = 0;
    }

    function step() {
        if (!running || gameOver) return;
        dir = nextDir;
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
        // wall collision
        if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) return end();
        // self collision
        if (snake.some(s => s.x===head.x && s.y===head.y)) return end();
        snake.unshift(head);
        if (head.x===food.x && head.y===food.y) {
            score += 1;
            document.getElementById('score').textContent = score;
            placeFood();
        } else {
            snake.pop();
        }
        draw();
    }

    function end() {
        running = false; gameOver = true;
        clearInterval(loop);
        if (score > best) {
            best = score;
            localStorage.setItem('snake-best', best);
            document.getElementById('best').textContent = best;
            showMsg('🎉 신기록!');
        } else {
            showMsg('💀 게임 오버');
        }
        document.getElementById('btnStart').textContent = '▶️ 다시 시작';
    }

    function showMsg(t) {
        const m = document.getElementById('msg');
        m.textContent = t; m.style.display = 'block';
        setTimeout(()=>{ if(gameOver) m.style.display='none'; }, 1600);
    }

    function toggle() {
        if (gameOver) { resetGame(); }
        running = !running;
        document.getElementById('btnStart').textContent = running ? '⏸ 일시정지' : '▶️ 시작';
        document.getElementById('msg').style.display = 'none';
        if (running) startLoop();
    }

    let speedMs = parseInt(document.getElementById('speed').value);
    function applySpeed() {
        speedMs = parseInt(document.getElementById('speed').value);
        if (running) { clearInterval(loop); startLoop(); }
    }
    function startLoop() { loop = setInterval(step, speedMs); }

    function setDir(d) {
        const map = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
        const nd = map[d];
        // prevent 180 reversal
        if (!(nd.x === -dir.x && nd.y === -dir.y)) nextDir = nd;
    }

    // keyboard
    const keyMap = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right', ' ':null };
    document.addEventListener('keydown', e => {
        if (keyMap[e.key] !== undefined) {
            e.preventDefault();
            if (keyMap[e.key] === null) toggle();
            else setDir(keyMap[e.key]);
        }
    });

    function applyTheme() { draw(); }

    // initial draw
    resetGame();
    draw();
</script>
</body>
</html>
