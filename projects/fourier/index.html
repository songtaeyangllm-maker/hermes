<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Fourier Demo</title>
<style>
:root{--bg:#0b0e16;--text:#e5e7eb;--accent:#60a5fa;--muted:#9ca3af;--card2:#1f2434;--border:#2a3042;--green:#22c55e;--pink:#f472b6;--yellow:#fbbf24}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;padding:24px;min-height:100vh}
h1{font-size:24px;letter-spacing:2px}h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.sig{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
button{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:7px 13px;font-size:12px;border-radius:7px;cursor:pointer;transition:all .2s}
button:hover{border-color:var(--accent)}
button.active{background:var(--accent);color:#0b0e16;border:none;font-weight:600}
.controls{display:flex;gap:16px;align-items:center;margin-bottom:14px;flex-wrap:wrap;justify-content:center}
canvas{background:#0d0f16;border:1px solid var(--border);border-radius:12px}
.metrics{color:var(--muted);font-size:13px;background:var(--card2);padding:12px 18px;border-radius:10px;border:1px solid var(--border);margin-top:12px;line-height:1.9;min-width:260px}
.metrics b{color:var(--accent)}
input[type=range]{accent-color:var(--accent)}
</style>
</head>
<body>
<h1>HERMES <span>FOURIER</span></h1>
<div class="sub">푸리에 급수 · 주기신호 근사 애니메이션</div>
<div class="sig" id="sig"></div>
<div class="controls">
  <label style="font-size:12px;color:var(--muted)">항 수 N = <b id="nval">40</b></label>
  <input type="range" id="nterm" min="1" max="200" value="40">
  <label style="font-size:12px;color:var(--muted)">속도</label>
  <input type="range" id="spd" min="1" max="100" value="30">
  <button id="soloToggle" onclick="soloToggle()">🔇 단독시그널</button>
</div>
<canvas id="cv"></canvas>
<div class="metrics" id="stats">N=40 · RMS 오차 대기</div>
<script>
'use strict';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const cvW=760,cvH=340;cv.width=cvW;cv.height=cvH;
const H=cvH/2;
let signal='square',N=40,animId=null,t=0,solo=false,phase=0;

// ---- 주기함수 정의 (f(x), x∈[0,1), f(x+1)=f(x)) ----
const FUNCS={
  square:x=> x<0.5 ? 1 : -1,
  sawtooth:x=> 2*x-1,
  triangle:x=> x<0.5 ? 4*x-1 : 3-4*x,
  fullwave:x=> Math.abs(Math.cos(2*Math.PI*x)), // 절대값 (전파정류)
  teeth:x=> 2*(x-Math.floor(x))-1 // 톱니 (비대칭)
};
function sigFn(name){return FUNCS[name]||FUNCS.square;}

// ---- 푸리에 계수 (해석적/수치) ----
// a0 = ∫f, an = 2∫f cos(2πn x), bn = 2∫f sin(2πn x)
function integrate(fn,lo,hi,sub=2000){
  let s=0,dx=(hi-lo)/sub;
  for(let i=0;i<sub;i++){const x0=lo+i*dx;const x1=x0+dx;s+=(fn(x0)+fn(x1))/2*dx;}
  return s;
}
function coeffs(name,nmax){
  const fn=sigFn(name);
  const a0=2*integrate(fn,0,1);
  const a=[],b=[];
  for(let n=1;n<=nmax;n++){
    a.push(2*integrate(x=>fn(x)*Math.cos(2*Math.PI*n*x),0,1,3000));
    b.push(2*integrate(x=>fn(x)*Math.sin(2*Math.PI*n*x),0,1,3000));
  }
  return {a0,a,b};
}
// 파싱된 계수 (캐시)
const coeffCache={};
function getCoeffs(name,n){
  const key=name+'_'+n;
  if(!coeffCache[key])coeffCache[key]=coeffs(name,n);
  return coeffCache[key];
}
// 푸리에 근사: f_N(x) = a0/2 + Σ(a_n cos + b_n sin)
function fourier(x,co){
  let v=co.a0/2;
  for(let n=1;n<=co.b.length;n++){
    v+=co.a[n-1]*Math.cos(2*Math.PI*n*x)+co.b[n-1]*Math.sin(2*Math.PI*n*x);
  }
  return v;
}
// RMS 오차
function rmsError(fn,co,Ns=2000){
  let ss=0;
  for(let i=0;i<Ns;i++){const x=i/Ns;const d=fn(x)-fourier(x,co);ss+=d*d;}
  return Math.sqrt(ss/Ns);
}

const SIGS=[
  {id:'square',name:'구형파'},
  {id:'sawtooth',name:'톱니파'},
  {id:'triangle',name:'삼각파'},
  {id:'fullwave',name:'전파정류'},
  {id:'teeth',name:'례짝톱니'},
];
function initSig(){
  const box=document.getElementById('sig');
  SIGS.forEach((s,idx)=>{const b=document.createElement('button');b.textContent=s.name;b.onclick=()=>setSig(s.id);box.appendChild(b);});
  document.querySelectorAll('#sig button')[0].classList.add('active');
}
function setSig(id){signal=id;document.querySelectorAll('#sig button').forEach((b,i2)=>b.classList.toggle('active',SIGS[i2].id===id));redraw();}
function soloToggle(){solo=!solo;document.getElementById('soloToggle').textContent=solo?'🔊 원신호+근사':'🔇 단독시그널';redraw();}
function xToPx(x){return x*cvW;}
function yToPx(y){return H-(y/cvHScale)*(cvH*0.62);}
let cvHScale=1.2; // 원신호 진폭 스케일

function loop(){
  const spd=+document.getElementById('spd').value;
  phase+=0.008*(spd/30);
  draw();
  animId=requestAnimationFrame(loop);
}
function draw(){
  ctx.fillStyle='#0d0f16';ctx.fillRect(0,0,cvW,cvH);
  // 그리드
  ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(cvW,H);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.25)';ctx.font='11px sans-serif';
  ctx.fillText('0',cvW/2+4,H-12);ctx.fillText('t',cvW-14,H-18);

  const N0=N;
  const co=getCoeffs(signal,N0);
  const fn=sigFn(signal);

  // 원신호 (얇은 회색 점선/실선)
  if(!solo){
    ctx.strokeStyle='rgba(255,255,255,0.14)';ctx.lineWidth=1;
    ctx.beginPath();
    const pts=300;
    for(let i=0;i<=pts;i++){
      const x=i/pts;const y=fn(x);
      ctx.lineTo(xToPx(x),yToPx(y));
    }
    ctx.stroke();
  }
  // 푸리에 근사
  ctx.strokeStyle='#60a5fa';ctx.lineWidth=2.2;
  ctx.shadowColor='rgba(96,165,250,0.6)';ctx.shadowBlur=8;
  ctx.beginPath();
  const pts2=400,Nth=Math.max(1,N0);
  for(let i=0;i<=pts2;i++){
    const x=i/pts2;
    const y=fourier(x,co);
    ctx.lineTo(xToPx(x),yToPx(y));
  }
  ctx.stroke();
  ctx.shadowBlur=0;
  // 이전 근사 (연한 파랑) 그리는 부분 제거

  // 진행 마커 (위상)
  const mx=((phase%1)+1)%1;
  ctx.fillStyle='#f472b6';
  ctx.beginPath();ctx.arc(xToPx(mx),yToPx(fn(mx)),4,0,7);ctx.fill();

  // 통계
  const err=rmsError(fn,co);
  document.getElementById('stats').innerHTML=
    'N=<b>'+N0+'</b> · RMS 오차 <b style="color:'+(err<0.05?'var(--green)':err<0.15?'var(--yellow)':'var(--pink)')+'">'+err.toFixed(4)+'</b>'+
    '<br>a0=<b>'+co.a0.toFixed(3)+'</b> · 계수 <b>'+N0+'차</b> Fourier 합성';
}
function redraw(){draw();}
document.getElementById('nterm').addEventListener('input',e=>{N=+e.target.value;document.getElementById('nval').textContent=N;redraw();});
initSig();loop();
</script>
</body>
</html>
