<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Dev Calculator</title>
<style>
:root { --bg:#0b0b12; --card:#13131c; --text:#ececf5; --muted:#6b6f82; --border:#23233a; --accent:#7c5cff; --ok:#5ce6a8; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Courier New',monospace,'Noto Sans KR'; background:var(--bg); color:var(--text); min-height:100vh; padding:32px; }
.wrap { max-width:820px; margin:0 auto; }
h1 { font-size:1.4rem; font-weight:800; margin-bottom:6px; }
h1 span { color:var(--accent); }
.sub { color:var(--muted); font-size:0.8rem; margin-bottom:24px; letter-spacing:1px; }

.input-card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:24px; margin-bottom:22px; }
.input-card label { display:block; font-size:0.78rem; color:var(--muted); margin-bottom:10px; text-transform:uppercase; letter-spacing:1px; }
textarea { width:100%; min-height:110px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:12px; padding:16px; font-family:inherit; font-size:0.95rem; resize:vertical; outline:none; }
textarea:focus { border-color:var(--accent); }

.toolbar { display:flex; flex-wrap:wrap; gap:10px; }
.chip { padding:10px 18px; border-radius:12px; background:var(--bg); border:1px solid var(--border); color:var(--text); font-family:inherit; font-size:0.82rem; font-weight:600; cursor:pointer; transition:all .15s; }
.chip:hover { border-color:var(--accent); color:#fff; }
.chip.active { background:var(--accent); border-color:var(--accent); color:#fff; }

.result-card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:24px; }
.res-row { margin-bottom:14px; }
.res-row:last-child { margin-bottom:0; }
.res-label { font-size:0.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
.res-val { background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:14px; font-size:0.9rem; word-break:break-all; white-space:pre-wrap; line-height:1.6; position:relative; }
.copy-btn { position:absolute; top:8px; right:8px; background:transparent; border:none; color:var(--muted); cursor:pointer; font-size:0.8rem; padding:4px 8px; border-radius:6px; }
.copy-btn:hover { color:#fff; background:rgba(124,92,255,0.2); }
.empty { color:var(--muted); font-size:0.85rem; }
</style>
</head>
<body>
<div class="wrap">
    <h1>⚙️ <span>DEV</span> CALC</h1>
    <div class="sub">인코더 & 해시 유틸리티</div>

    <div class="input-card">
        <label>입력 텍스트</label>
        <textarea id="input" placeholder="변환할 텍스트를 입력하세요..."></textarea>
    </div>

    <div class="toolbar" style="margin-bottom:22px">
        <button class="chip active" data-fn="base64">🅱 Base64 인코딩</button>
        <button class="chip" data-fn="url">🔗 URL 인코딩</button>
        <button class="chip" data-fn="escape">↪ Escape</button>
        <button class="chip" data-fn="html">🌐 HTML 엔티티</button>
        <button class="chip" data-fn="hex">➗ HEX</button>
        <button class="chip" data-fn="bank">🏦 계좌번호 형식</button>
        <button class="chip" data-fn="sha256">🔒 SHA-256</button>
        <button class="chip" data-fn="md5">🔑 MD5</button>
        <button class="chip" data-fn="time">⏱ Time→Date</button>
    </div>

    <div class="result-card">
        <div id="results"><div class="empty" style="padding:20px;text-align:center">결과가 여기에 표시됩니다.</div></div>
    </div>
</div>

<script>
const input = document.getElementById('input');
const results = document.getElementById('results');
let currentFn = 'base64';

input.addEventListener('input', () => compute(currentFn));

function setChips(fn) {
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.fn === fn));
}
document.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('click', () => { currentFn = c.dataset.fn; setChips(currentFn); compute(currentFn); });
});

function compute(fn) {
    const val = input.value;
    const out = [];
    const add = (label, value) => out.push(`<div class="res-row"><div class="res-label">${label}</div><div class="res-val">${escapeHtml(value)}<button class="copy-btn" onclick="copyText(this, '${cssEsc(label)}')">📋</button></div></div>`);

    if (!val.trim()) {
        results.innerHTML = '<div class="empty" style="padding:20px;text-align:center">입력 텍스트를 입력하세요.</div>';
        return;
    }

    try {
        if (fn === 'base64') {
            const b64 = btoa(unescape(encodeURIComponent(val)));
            add('Base64 인코딩', b64);
            add('문자열 길이', b64.length + ' chars');
        } else if (fn === 'url') {
            add('URL 인코딩', encodeURIComponent(val));
            add('URL 디코딩', decodeURIComponent(val));
        } else if (fn === 'escape') {
            add('Escape (escape())', escape(val));
            add('Unescape', unescape(val));
        } else if (fn === 'html') {
            const esc = val.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
            add('HTML 엔티티 (esc)', esc);
            add('HTML 엔티티 (unesc)', esc.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"'));
        } else if (fn === 'hex') {
            const hex = Array.from(new TextEncoder().encode(val)).map(b => b.toString(16).padStart(2,'0')).join(' ');
            add('HEX (UTF-8)', hex);
            add('HEX (없는 공백)', hex.replace(/ /g,''));
        } else if (fn === 'bank') {
            const cleaned = val.replace(/\D/g,'');
            add('계좌번호 (숫자만)', cleaned);
            add('계좌번호 (XX-XXX-XXXXXX)', cleaned.replace(/^(\d{2})(\d{3})(\d+)$/, '$1-$2-$3'));
        } else if (fn === 'sha256' || fn === 'md5') {
            crypto.subtle.digest(fn, new TextEncoder().encode(val)).then(buf => {
                const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
                results.innerHTML = `<div class="res-row"><div class="res-label">${fn.toUpperCase()} 해시</div><div class="res-val">${hex}<button class="copy-btn" onclick="copyText(this, 'hash')">📋</button></div></div>`;
            });
            results.innerHTML = '<div class="empty" style="padding:20px;text-align:center">해시 계산 중...</div>';
            return;
        } else if (fn === 'time') {
            const ms = parseInt(val, 10);
            if (!isNaN(ms)) {
                const d = new Date(ms);
                add('Date (로컬)', d.toLocaleString('ko-KR'));
                add('Date (ISO)', d.toISOString());
                add('Unix Timestamp', Math.floor(d.getTime()/1000) + 's');
            } else {
                const d = new Date(val);
                if (!isNaN(d.getTime())) {
                    add('Unix Timestamp (ms)', d.getTime());
                    add('Unix Timestamp (s)', Math.floor(d.getTime()/1000));
                } else {
                    results.innerHTML = '<div class="empty" style="padding:20px;text-align:center">유효한 timestamp 또는 날짜를 입력하세요.</div>';
                    return;
                }
            }
        } else if (fn === 'sha256') {
            crypto.subtle.digest('SHA-256', new TextEncoder().encode(val)).then(buf => {
                const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
                add('SHA-256', hex);
                results.innerHTML = out.join('');
            });
            return;
        }
    } catch(e) {
        add('오류', e.message);
    }
    results.innerHTML = out.join('');
}

function cssEsc(s) { return s.replace(/[^a-z0-9]/gi, ''); }
function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function copyText(btn, label) {
    const val = btn.closest('.res-val').childNodes[0].textContent;
    navigator.clipboard.writeText(val).then(() => { btn.textContent = '✔'; setTimeout(()=>btn.textContent='📋', 1200); });
}

// Init
compute('base64');
</script>
</body>
</html>
