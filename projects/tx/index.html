<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Text Analyzer</title>
<style>
:root { --bg:#05070e; --text:#dbe4f0; --muted:#6b7686; --card:#0d1424; --border:#1c2a44; --accent:#5b8cff; --green:#4ade80; }
*{ margin:0; padding:0; box-sizing:border-box; }
body{ background:var(--bg); color:var(--text); font-family:'Segoe UI',sans-serif; padding:20px; display:flex; flex-direction:column; align-items:center; gap:14px; }
h1{ font-size:19px; letter-spacing:2px; } h1 span{ color:var(--green); }
.sub{ color:var(--muted); font-size:12px; }
.wrap{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; align-items:flex-start; max-width:920px; width:100%; }
textarea{ width:100%; background:#0a0f1e; border:1px solid var(--border); color:var(--text); border-radius:10px; padding:12px; font-size:14px; min-height:220px; resize:vertical; font-family:inherit; line-height:1.7; }
.box{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; flex:1; min-width:280px; }
.box h3{ font-size:13px; color:#9fb0c8; margin-bottom:10px; }
.metrics{ display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:8px; }
.m{ background:#0a0f1e; border:1px solid var(--border); border-radius:9px; padding:10px; text-align:center; }
.m b{ display:block; font-size:22px; color:var(--green); } .m span{ font-size:11px; color:var(--muted); }
.freq{ display:flex; flex-direction:column; gap:6px; }
.f{ display:flex; align-items:center; gap:8px; font-size:12px; }
.f .w{ width:120px; color:#c8d2e4; } .bar{ height:14px; border-radius:4px; background:linear-gradient(90deg,var(--accent),#9b6bff); }
.actions{ display:flex; gap:8px; }
.btn{ background:#16223a; color:#dbe4f0; border:1px solid var(--border); border-radius:8px; padding:7px 13px; cursor:pointer; font-size:12px; }
.btn:hover{ background:#1f3050; }
.tiny{ color:var(--muted); font-size:11px; margin-top:6px; }
</style>
</head>
<body>
<h1>TEXT <span>· ANALYZER</span></h1>
<div class="sub">타이핑 즉시 분석 — 공백·어절·문장·빈도·가독성</div>
<textarea id="ta" placeholder="여기에 텍스트를 입력하세요…"></textarea>
<div class="wrap">
  <div class="box">
    <h3>📊 핵심 지표</h3>
    <div class="metrics">
      <div class="m"><b id="mChar">0</b><span>문자</span></div>
      <div class="m"><b id="mSp">0</b><span>공백제외</span></div>
      <div class="m"><b id="mWord">0</b><span>어절</span></div>
      <div class="m"><b id="mS">0</b><span>문장</span></div>
      <div class="m"><b id="mUnique">0</b><span>고유어절</span></div>
      <div class="m"><b id="mLong">0</b><span>긴 문장</span></div>
    </div>
    <div class="tiny">가독성: <b id="mRead" style="color:#e9b45b"></b></div>
    <div class="tiny">타자속도: <b id="mSpeed" style="color:#e9b45b"></b></div>
  </div>
  <div class="box">
    <h3>🏆 자주 쓰는 단어</h3>
    <div class="freq" id="freq"></div>
  </div>
</div>
<div class="actions">
  <button class="btn" id="copy">📋 복사</button>
  <button class="btn" id="clr">🗑️ 지우기</button>
</div>
<script>
const $=id=>document.getElementById(id);
let startTime=null, baselineLen=0;
$('ta').addEventListener('input',e=>{
  const t=e.target.value;
  if(startTime===null&&t.length){ startTime=Date.now(); baselineLen=t.length; }
  const chars=t.length;
  const noSpace=t.replace(/\s/g,'').length;
  const words=t.split(/\s+/).filter(w=>w.length).length;
  const sentences=t.split(/[.!?。！？…]+/).filter(s=>s.trim().length).length;
  const uniq=new Set(t.split(/\s+/).filter(w=>w.length)).size;
  const longS=t.split(/[.!?。！？…]+/).filter(s=>s.trim().split(/\s+/).length>9).length;
  $('mChar').textContent=chars; $('mSp').textContent=noSpace; $('mWord').textContent=words; $('mS').textContent=sentences; $('mUnique').textContent=uniq; $('mLong').textContent=longS;
  const read=sentences? (words/sentences).toFixed(1):'0.0';
  $('mRead').textContent=`문장당 ${read} 어절 · ${read<5?'간결':read<8?'보통':'긴문장'}`;
  // speed
  if(startTime && words>0){ const sec=(Date.now()-startTime)/1000; $('mSpeed').textContent=`${(words/sec).toFixed(1)} 어절/초`; }
  // freq
  const freq={}; t.split(/\s+/).filter(w=>w.length>1).forEach(w=>{ const k=w.toLowerCase().replace(/[^a-z0-9가-힣]/g,''); if(k)freq[k]=(freq[k]||0)+1; });
  const top=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const max=top.length?top[0][1]:1;
  $('freq').innerHTML=top.length? top.map(([w,c])=>`<div class="f"><span class="w">${w}</span><div class="bar" style="width:${Math.max(6,(c/max)*100)}%"></div><span class="tiny">${c}</span></div>`).join('') : '<span class="tiny">아직 단어가 없습니다</span>';
});
$('copy').addEventListener('click',()=>{ const t=$('ta').value; navigator.clipboard.writeText(t); const b=$('copy'); b.textContent='✔ 복사됨'; setTimeout(()=>b.textContent='📋 복사',800); });
$('clr').addEventListener('click',()=>{ $('ta').value=''; startTime=null; $('ta').dispatchEvent(new Event('input')); });
$('ta').addEventListener('input',()=>{}); // placeholder trigger reset via clr
</script>
</body>
</html>
