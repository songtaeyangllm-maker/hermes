<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Timer</title>
<style>
:root { --bg:#0b0e16; --text:#e5e7eb; --muted:#6b7686; --card:#121826; --border:#1e2840; --accent:#facc15; }
*{ margin:0; padding:0; box-sizing:border-box; }
body{ background:var(--bg); color:var(--text); font-family:'Segoe UI',sans-serif; display:flex; flex-direction:column; align-items:center; gap:14px; padding:16px; }
h1{ font-size:20px; letter-spacing:2px; } h1 span{ color:var(--accent); }
.sub{ color:var(--muted); font-size:12px; }
.tabs{ display:flex; gap:8px; } .tab{ background:#16223a; border:1px solid var(--border); border-radius:8px; padding:8px 18px; cursor:pointer; font-size:13px; color:var(--muted); } .tab.on{ color:var(--text); border-color:var(--accent); background:#1f3050; }
.view{ display:none; width:100%; max-width:640px; } .view.on{ display:block; }
.clockwrap{ text-align:center; padding:26px 0; }
.clock{ font-family:Consolas,monospace; font-size:64px; font-weight:bold; color:var(--text); letter-spacing:2px; text-shadow:0 0 24px rgba(250,204,21,.25); }
.clock.small{ font-size:40px; }
.controls{ display:flex; gap:10px; justify-content:center; }
.btn{ background:#16223a; color:var(--text); border:1px solid var(--border); border-radius:10px; padding:10px 22px; cursor:pointer; font-size:14px; }
.btn:hover{ background:#1f3050; } .btn.acc{ background:var(--accent); color:#0b0e16; font-weight:bold; } .btn.danger{ background:#701a1a; }
input[type=number]{ background:#0d1322; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px 10px; font-size:16px; width:70px; text-align:center; font-family:Consolas,monospace; }
.setrow{ display:flex; gap:10px; justify-content:center; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
.setrow label{ font-size:12px; color:var(--muted); }
.timerList{ display:flex; flex-direction:column; gap:8px; margin-top:14px; }
.tcard{ background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
.tcard b{ font-family:Consolas,monospace; font-size:24px; } .tcard .name{ font-size:12px; color:var(--muted); } .tcard.done b{ color:var(--accent); }
.laps{ background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px; margin-top:14px; font-size:13px; color:#9fb0c8; max-height:180px; overflow-y:auto; }
.lap{ display:flex; justify-content:space-between; padding:4px 6px; border-bottom:1px solid var(--border); }
.empty{ color:var(--muted); text-align:center; padding:20px; font-size:12px; }
.goal-row{ display:flex; justify-content:space-between; }
</style>
</head>
<body>
<h1>TIMER <span>::</span> STOPWATCH</h1>
<div class="sub">멀티 카운트다운 타이머 · 스톱워치 · 완료 시 음성 알림</div>
<div class="tabs"><div class="tab on" data-v="timer">⏳ 타이머</div><div class="tab" data-v="stop">⏱️ 스톱워치</div></div>

<!-- 타이머 뷰 -->
<div class="view on" id="v-timer">
  <div class="setrow">
    <label>분</label><input type="number" id="tMin" value="5" min="0" max="999">
    <label>초</label><input type="number" id="tSec" value="0" min="0" max="59">
    <button class="btn acc" id="addTimer">+ 타이머 추가</button>
  </div>
  <div class="timerList" id="timerList"></div>
</div>

<!-- 스톱워치 뷰 -->
<div class="view" id="v-stop">
  <div class="clockwrap"><div class="clock" id="swClock">00:00:00.0</div><div style="color:var(--muted);font-size:12px;margin-top:6px" id="swState">준비</div></div>
  <div class="controls">
    <button class="btn acc" id="swStart">▶ 시작</button>
    <button class="btn" id="swLap">🏁 랩</button>
    <button class="btn danger" id="swReset">↺ 초기화</button>
  </div>
  <div class="laps" id="swLaps"><div class="empty">랩 기록이 여기에 표시됩니다</div></div>
</div>

<script>
// ======== 오디오 + TTS ========
function beep(){ try{ const c=new (window.AudioContext||window.webkitAudioContext)(); [0,0,0].forEach((_,i)=>{ const o=c.createOscillator(),g=c.createGain(); o.frequency.value=880+i*110; o.type='sine'; g.gain.value=.2; g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.4+i*.2); o.connect(g); g.connect(c.destination); o.start(c.currentTime+i*.18); o.stop(c.currentTime+.5+i*.2); }); }catch(e){} }
function speak(t){ try{ if(window.speechSynthesis){ const u=new SpeechSynthesisUtterance(t); u.lang='ko-KR'; u.rate=1; speechSynthesis.speak(u); } }catch(e){} }
// ======== 타이머 ========
let timers=[], timerId=0;
function pad2(n){ return String(n).padStart(2,'0'); }
function fmtMs(ms){ const s=Math.floor(ms/1000); const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60; return (h?pad2(h)+':':'')+pad2(m)+':'+pad2(sec); }
function renderTimers(){
  const el=document.getElementById('timerList');
  if(!timers.length){ el.innerHTML='<div class="empty">타이머를 추가하세요 — 완료되면 소리+음성으로 알려드려요</div>'; return; }
  el.innerHTML=timers.map(t=>`<div class="tcard ${t.done?'done':''}" data-id="${t.id}">
    <div><b>${t.done?'✅ ':''}${fmtMs(t.remain)}</b>${t.name?`<div class="name">${t.name}</div>`:''}</div>
    <div style="display:flex;gap:6px"><button class="btn" style="font-size:11px;padding:6px 10px" data-pause="${t.id}">${t.running?'⏸':'▶'}</button><button class="btn danger" style="font-size:11px;padding:6px 10px" data-del="${t.id}">🗑</button></div>
  </div>`).join('');
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ timers=timers.filter(t=>t.id!==+b.dataset.del); renderTimers(); });
  document.querySelectorAll('[data-pause]').forEach(b=>b.onclick=()=>{ const t=timers.find(x=>x.id===+b.dataset.pause); if(t){ t.running=!t.running; renderTimers(); } });
}
document.getElementById('addTimer').onclick=()=>{
  const m=+document.getElementById('tMin').value||0, s=+document.getElementById('tSec').value||0;
  const total=(m*60+s)*1000; if(!total)return;
  const now=Date.now();
  timers.push({id:++timerId,name:(m?m+'분':'')+(s?s+'초':'')+' 타이머',remain:total,endAt:now+total,running:true,done:false});
  renderTimers();
};
// 메인 루프
setInterval(()=>{ const now=Date.now(); let changed=false;
  timers.forEach(t=>{ if(t.running&&!t.done){ t.remain=Math.max(0,t.endAt-now); if(t.remain===0){ t.done=true; t.running=false; beep(); speak(t.name+' 완료!'); changed=true; } } });
  if(changed)renderTimers();
}, 100);
// ======== 스톱워치 ========
let sw={running:false,start:0,elapsed:0,laps:[]};
function swFmt(ms){ const cs=Math.floor(ms/10)%100, s=Math.floor(ms/1000)%60, m=Math.floor(ms/60000)%60, h=Math.floor(ms/3600000); return pad2(h)+':'+pad2(m)+':'+pad2(s)+'.'+String(cs).padStart(1,'0'); }
function swRender(){ document.getElementById('swClock').textContent=swFmt(sw.elapsed); }
setInterval(()=>{ if(sw.running){ sw.elapsed=Date.now()-sw.start; swRender(); } }, 33);
document.getElementById('swStart').onclick=()=>{ if(!sw.running){ sw.start=Date.now()-sw.elapsed; sw.running=true; document.getElementById('swStart').textContent='⏸ 일시정지'; document.getElementById('swState').textContent='측정 중'; } else { sw.running=false; document.getElementById('swStart').textContent='▶ 재개'; document.getElementById('swState').textContent='일시정지'; } };
document.getElementById('swLap').onclick=()=>{ if(!sw.running)return; sw.laps.unshift(sw.elapsed); renderLaps(); };
document.getElementById('swReset').onclick=()=>{ sw={running:false,start:0,elapsed:0,laps:[]}; document.getElementById('swStart').textContent='▶ 시작'; document.getElementById('swState').textContent='준비'; swRender(); renderLaps(); };
function renderLaps(){ const el=document.getElementById('swLaps'); if(!sw.laps.length){ el.innerHTML='<div class="empty">랩 기록이 여기에 표시됩니다</div>'; return; } el.innerHTML=sw.laps.map((l,i)=>`<div class="lap"><span>랩 ${sw.laps.length-i}</span><b>${swFmt(l)}</b></div>`).join(''); }
// ======== 탭 ========
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on')); t.classList.add('on'); document.querySelectorAll('.view').forEach(v=>v.classList.remove('on')); document.getElementById('v-'+t.dataset.v).classList.add('on'); });
renderTimers();
</script>
</body>
</html>
