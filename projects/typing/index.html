<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes 타이핑 속도 측정</title>
<style>
    :root { --bg:#0b0b12; --card:#13131c; --text:#ececf5; --muted:#6b6f82; --border:#23233a; --accent:#7c5cff; --green:#2ee6a8; --red:#ff5c7a; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,'Segoe UI','Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:30px 20px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:24px; padding:34px 36px; max-width:720px; width:100%; }
    .title { font-size:1.5rem; font-weight:800; text-align:center; margin-bottom:6px; }
    .subtitle { text-align:center; color:var(--muted); font-size:0.85rem; margin-bottom:26px; }

    .stats { display:flex; gap:14px; justify-content:center; margin-bottom:26px; flex-wrap:wrap; }
    .stat { background:#0d0d17; border:1px solid var(--border); border-radius:16px; padding:14px 26px; text-align:center; min-width:110px; }
    .stat .v { font-size:1.8rem; font-weight:800; color:var(--accent); }
    .stat .l { font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-top:2px; }

    .type-mode { display:flex; gap:8px; justify-content:center; margin-bottom:18px; }
    .mode { padding:7px 16px; border-radius:20px; cursor:pointer; font-size:0.8rem; background:rgba(124,92,255,0.08); border:1px solid var(--border); color:var(--muted); }
    .mode.active { background:var(--accent); color:#fff; border-color:var(--accent); }

    .prompt { font-size:1.5rem; line-height:2; letter-spacing:0.5px; min-height:120px; margin-bottom:20px; font-family:'Malgun Gothic','Noto Sans KR',sans-serif; }
    .prompt .char { position:relative; }
    .prompt .correct { color:#5ce6a8; }
    .prompt .wrong { color:var(--red); background:rgba(255,92,122,0.15); border-radius:3px; }
    .prompt .current { background:rgba(124,92,255,0.25); border-radius:3px; box-shadow:0 0 0 1px var(--accent); }

    .input-wrap { position:relative; }
    .input { width:100%; padding:16px 18px; font-size:1.4rem; background:#0d0d17; border:2px solid var(--border); border-radius:16px; color:var(--text); outline:none; font-family:inherit; }
    .input:focus { border-color:var(--accent); }
    .input:disabled { opacity:0.5; }

    .controls { display:flex; gap:12px; justify-content:center; margin-top:20px; }
    .btn { background:var(--accent); color:#fff; border:none; cursor:pointer; padding:12px 26px; border-radius:12px; font-size:0.95rem; font-weight:700; }
    .btn.ghost { background:transparent; border:1px solid var(--border); color:var(--text); }

    .result { display:none; text-align:center; margin-top:22px; padding:22px; background:rgba(92,230,168,0.07); border:1px solid var(--border); border-radius:16px; }
    .result.show { display:block; }
    .result h3 { font-size:1.3rem; margin-bottom:10px; }
    .result .r-grid { display:flex; gap:20px; justify-content:center; flex-wrap:wrap; }
    .result .r-item { text-align:center; }
    .result .r-item .v { font-size:2rem; font-weight:800; color:var(--green); }
    .result .r-item .l { font-size:0.75rem; color:var(--muted); }
</style>
</head>
<body>
<div class="card">
    <div class="title">⌨️ 타이핑 속도 측정</div>
    <div class="subtitle">문장을 입력하면 WPM과 정확도를 실시간 측정합니다</div>

    <div class="stats">
        <div class="stat"><div class="v" id="wpmLive">0</div><div class="l">WPM</div></div>
        <div class="stat"><div class="v" id="accLive">100</div><div class="l">정확도 %</div></div>
        <div class="stat"><div class="v" id="time">00:00</div><div class="l">시간</div></div>
        <div class="stat"><div class="v" id="prog">0/0</div><div class="l">진행</div></div>
    </div>

    <div class="type-mode">
        <span class="mode active" data-m="ko">🇰🇷 한글</span>
        <span class="mode" data-m="en">🇺🇸 English</span>
        <span class="mode" data-m="mix">🔀 혼합</span>
    </div>

    <div class="prompt" id="prompt"></div>
    <div class="input-wrap">
        <input class="input" id="input" placeholder="여기에 입력 시작…" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>

    <div class="controls">
        <button class="btn" id="restart" onclick="restart()">🔄 다시 시작</button>
    </div>

    <div class="result" id="result">
        <h3>🎉 완료!</h3>
        <div class="r-grid">
            <div class="r-item"><div class="v" id="rWpm">0</div><div class="l">WPM</div></div>
            <div class="r-item"><div class="v" id="rAcc">0%</div><div class="l">정확도</div></div>
            <div class="r-item"><div class="v" id="rTime">0s</div><div class="l">소요 시간</div></div>
            <div class="r-item"><div class="v" id="rCps">0</div><div class="l">초당 타수</div></div>
        </div>
    </div>
</div>

<script>
    const KO = [
        '바람이 창문으로 불어들었다',
        '오늘도 좋은 하루가 되기를 바란다',
        '노력은 결코 배신하지 않는다',
        '따뜻한 커피 한 잔이 생각나는 아침이다',
        '꿈꾸는 자만이 현실을 바꿀 수 있다',
        '우리는 서로를 이해하려 애쓰는 존재다',
        '산책을 하며 가을의 정취를 느꼈다',
    ];
    const EN = [
        'the quick brown fox jumps over the lazy dog',
        'practice makes perfect and patience is a virtue',
        'keep your friends close but your enemies closer',
        'a journey of a thousand miles begins with a single step',
        'the best way to predict the future is to invent it',
        'success is not final failure is not fatal it is the courage to continue',
    ];
    let mode = 'ko';
    let text = '';
    let startTime = 0;
    let timer = null;
    let done = false;
    let keystrokes = 0, errors = 0;

    function pickText() {
        let arr;
        if (mode === 'ko') arr = KO;
        else if (mode === 'en') arr = EN;
        else arr = [...KO, ...EN];
        // for mix, alternate
        let t = arr[Math.floor(Math.random()*arr.length)];
        if (mode === 'mix') {
            if (Math.random() < 0.5) t = KO[Math.floor(Math.random()*KO.length)];
            else t = EN[Math.floor(Math.random()*EN.length)];
        }
        return t;
    }

    function render() {
        const p = document.getElementById('prompt');
        p.innerHTML = '';
        for (let i=0; i<text.length; i++) {
            const c = document.createElement('span');
            c.className = 'char'; c.dataset.i = i;
            c.textContent = text[i] === ' ' ? '\u00A0' : text[i];
            p.appendChild(c);
        }
    }

    function update(idx) {
        const chars = document.querySelectorAll('.char');
        chars.forEach(c => {
            const i = +c.dataset.i;
            c.classList.remove('correct','wrong','current');
            if (i < idx) c.classList.add('correct');
            if (i === idx) c.classList.add('current');
        });
        document.getElementById('prog').textContent = `${idx}/${text.length}`;
        // accuracy
        const acc = idx===0 ? 100 : Math.max(0, Math.round(100 * (1 - errors/keystrokes)));
        document.getElementById('accLive').textContent = acc;
    }

    function timeFmt(ms) {
        const s = Math.floor(ms/1000);
        return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
    }

    function startTimer() {
        if (timer) return;
        startTime = Date.now();
        timer = setInterval(() => {
            if (done) return;
            const el = Date.now() - startTime;
            document.getElementById('time').textContent = timeFmt(el);
            // live wpm: words typed so far over elapsed
            const idx = document.querySelectorAll('.correct').length;
            const words = idx/5;
            const mins = el/60000;
            const wpm = mins>0 ? Math.round(words/mins) : 0;
            document.getElementById('wpmLive').textContent = wpm;
        }, 200);
    }

    const input = document.getElementById('input');
    input.addEventListener('input', () => {
        if (done) return;
        startTimer();
        const val = input.value;
        keystrokes++;
        const idx = val.length;
        const expectedChar = text[idx-1];
        if (expectedChar !== undefined && val.slice(-1) !== expectedChar) errors++;
        update(idx);
        if (idx >= text.length) finish();
    });

    function finish() {
        done = true;
        clearInterval(timer);
        const elapsed = Date.now() - startTime;
        const secs = elapsed/1000;
        const words = text.length/5;
        const wpm = secs>0 ? Math.round(words/(secs/60)) : 0;
        const acc = keystrokes>0 ? Math.round(100*(1-errors/keystrokes)) : 100;
        document.getElementById('rWpm').textContent = wpm;
        document.getElementById('rAcc').textContent = acc + '%';
        document.getElementById('rTime').textContent = secs.toFixed(1) + 's';
        document.getElementById('rCps').textContent = (text.length/secs).toFixed(1);
        document.getElementById('wpmLive').textContent = wpm;
        document.getElementById('result').classList.add('show');
        input.disabled = true;
    }

    function restart() {
        done = false; errors = 0; keystrokes = 0;
        clearInterval(timer); timer = null;
        input.disabled = false; input.value = '';
        document.getElementById('result').classList.remove('show');
        document.getElementById('time').textContent = '00:00';
        document.getElementById('wpmLive').textContent = '0';
        document.getElementById('accLive').textContent = '100';
        text = pickText();
        render();
        update(0);
        document.getElementById('input').focus();
    }

    document.querySelectorAll('.mode').forEach(m => {
        m.addEventListener('click', () => {
            document.querySelectorAll('.mode').forEach(x => x.classList.remove('active'));
            m.classList.add('active');
            mode = m.dataset.m;
            restart();
        });
    });

    restart();
</script>
</body>
</html>
