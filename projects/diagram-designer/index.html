<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Diagram Designer</title>
<style>
:root{--bg:#0b0e16;--text:#e5e7eb;--muted:#6b7686;--card:#121826;--border:#1e2840;--accent:#60a5fa;--good:#4ade80;--bad:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;height:100vh}
header{background:var(--card);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:16px;letter-spacing:1px}header h1 span{color:var(--accent)}
.toolbar{display:flex;gap:8px;align-items:center}.btn{background:var(--accent);color:#0b0e16;border:none;padding:6px 12px;font-size:12px;border-radius:4px;cursor:pointer}.btn:hover{opacity:.9}.btn.secondary{background:var(--border);color:var(--text)}
#main{flex:1;display:flex}
#palette{width:220px;background:var(--card);border-right:1px solid var(--border);padding:16px;overflow-y:auto}
#palette h3{font-size:11px;color:var(--muted);margin-bottom:12px;text-transform:uppercase}
.shape-item{padding:10px 12px;margin-bottom:8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:grab;font-size:13px;display:flex;align-items:center;gap:8px}
.shape-item:hover{background:var(--border);border-color:var(--accent)}
.shape-item svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:2}
#canvas-area{flex:1;position:relative;background:#0d1117;overflow:auto}
#diagramCanvas{position:absolute;top:0;left:0;background:repeating-linear-gradient(45deg,transparent,transparent 10px,#1a1f2e 10px,#1a1f2e 20px);touch-action:none}
#minimap{position:absolute;bottom:20px;right:20px;width:200px;height:150px;background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden}
#minimapView{width:100%;height:100%}
#properties{width:280px;background:var(--card);border-left:1px solid var(--border);padding:16px;overflow-y:auto}
#properties h3{font-size:11px;color:var(--muted);margin-bottom:12px;text-transform:uppercase}
.prop{margin-bottom:12px}.prop label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.prop input,.prop select,.prop textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:4px;font-size:12px}
.connection{stroke:var(--accent);stroke-width:2;fill:none;marker-end:url(#arrowhead)}
.connection.selected{stroke:var(--good);stroke-width:3}
.node{position:absolute;cursor:move;user-select:none;transition:box-shadow .2s}
.node.selected{box-shadow:0 0 0 2px var(--accent),0 0 12px var(--accent)}
.node-content{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 16px;min-width:120px;text-align:center;white-space:nowrap}
.node-ports{display:flex;justify-content:space-between;margin-top:8px}
.port{width:12px;height:12px;border-radius:50%;background:var(--border);border:2px solid var(--accent);cursor:crosshair}
.port:hover{background:var(--accent)}
.port.input{margin-right:auto}.port.output{margin-left:auto}
.footer{padding:8px;color:var(--muted);font-size:11px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>DIAGRAM <span>DESIGNER</span></h1>
  <div class="toolbar">
    <button class="btn secondary" onclick="newDiagram()">새 다이어그램</button>
    <button class="btn secondary" onclick="exportJSON()">JSON 내보내기</button>
    <button class="btn secondary" onclick="importJSON()">가져오기</button>
    <button class="btn" onclick="exportPNG()">PNG 내보내기</button>
    <input type="file" id="jsonFile" accept=".json" style="display:none" onchange="loadJSON(event)">
    <span style="color:var(--muted);font-size:12px">확대/축소: 휠 | 이동: 드래그</span>
  </div>
</header>
<div id="main">
  <div id="palette">
    <h3>노드 유형</h3>
    <div class="shape-item" draggable="true" data-type="process" ondragstart="dragStart(event)">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      프로세스
    </div>
    <div class="shape-item" draggable="true" data-type="decision" ondragstart="dragStart(event)">
      <svg viewBox="0 0 24 24"><polygon points="12,2 22,12 12,22 2,12"/></svg>
      결정
    </div>
    <div class="shape-item" draggable="true" data-type="start" ondragstart="dragStart(event)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>
      시작/끝
    </div>
    <div class="shape-item" draggable="true" data-type="data" ondragstart="dragStart(event)">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h12"/></svg>
      데이터
    </div>
    <div class="shape-item" draggable="true" data-type="document" ondragstart="dragStart(event)">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      문서
    </div>
    <div class="shape-item" draggable="true" data-type="database" ondragstart="dragStart(event)">
      <svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12"/><path d="M20 6v12"/></svg>
      데이터베이스
    </div>
    <div class="shape-item" draggable="true" data-type="subroutine" ondragstart="dragStart(event)">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg>
      서브루틴
    </div>
  </div>
  <div id="canvas-area">
    <svg id="diagramCanvas" width="3000" height="2000"></svg>
    <div id="minimap"><svg id="minimapView"></svg></div>
  </div>
  <div id="properties">
    <h3>속성</h3>
    <div id="propPanel">
      <div style="color:var(--muted);text-align:center;padding:20px">노드를 선택하세요</div>
    </div>
  </div>
</div>
<div class="footer">Hermes Diagram Designer | 플로차트/시퀀스/아키텍처 다이어그램 | 계속 업데이트됨</div>

<svg style="position:absolute;width:0;height:0"><defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="var(--accent)"/></marker></defs></svg>

<script>
const canvas=document.getElementById('diagramCanvas');
const minimapView=document.getElementById('minimapView');
const propPanel=document.getElementById('propPanel');
const canvasArea=document.getElementById('canvas-area');

let nodes=[],connections=[],selectedNode=null,selectedConnection=null;
let nodeId=0,connId=0;
let scale=1,panX=0,panY=0;
let isPanning=false,panStart={x:0,y:0};
let connectingFrom=null,connectStartPort=null;

const nodeTemplates={
  process:{width:140,height:60,color:'#60a5fa',ports:['in','out']},
  decision:{width:120,height:80,color:'#fbbf24',ports:['in','yes','no']},
  start:{width:100,height:100,color:'#4ade80',ports:['out']},
  data:{width:140,height:60,color:'#a78bfa',ports:['in','out']},
  document:{width:120,height:80,color:'#f87171',ports:['in','out']},
  database:{width:110,height:70,color:'#fb923c',ports:['in','out']},
  subroutine:{width:150,height:80,color:'#22d3ee',ports:['in','out']}
};

function dragStart(e){
  e.dataTransfer.setData('text/plain',e.target.dataset.type);
}

canvasArea.addEventListener('dragover',e=>e.preventDefault());
canvasArea.addEventListener('drop',e=>{
  e.preventDefault();
  const type=e.dataTransfer.getData('text/plain');
  if(type){
    const rect=canvasArea.getBoundingClientRect();
    const x=(e.clientX-rect.left-panX)/scale;
    const y=(e.clientY-rect.top-panY)/scale;
    createNode(type,x,y);
  }
});

function createNode(type,x,y){
  const t=nodeTemplates[type];
  const id=`node${++nodeId}`;
  const node=document.createElement('div');
  node.className='node';
  node.dataset.id=id;
  node.dataset.type=type;
  node.style.left=`${x}px`;
  node.style.top=`${y}px`;
  
  const portsHtml=t.ports.map((p,i)=>`<div class="port ${p==='in'||p==='yes'?'input':'output'}" data-port="${p}" data-node="${id}" title="${p}"></div>`).join('');
  
  node.innerHTML=`
    <div class="node-content" style="border-color:${t.color}">${type.charAt(0).toUpperCase()+type.slice(1)}</div>
    <div class="node-ports">${portsHtml}</div>
  `;
  
  node.onmousedown=e=>{if(e.target.classList.contains('port'))return;selectNode(node);startDrag(e,node)};
  node.querySelectorAll('.port').forEach(p=>{p.onmousedown=e=>startConnection(e,p)});
  
  canvasArea.appendChild(node);
  nodes.push({id,type,x,y,element:node,ports:t.ports});
  selectNode(node);
  updateMinimap();
}

function selectNode(node){
  document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));
  document.querySelectorAll('.connection').forEach(c=>c.classList.remove('selected'));
  if(node){
    node.classList.add('selected');
    selectedNode=node;
    selectedConnection=null;
    showNodeProps(node);
  }else{
    selectedNode=null;
    propPanel.innerHTML='<div style="color:var(--muted);text-align:center;padding:20px">노드를 선택하세요</div>';
  }
}

function showNodeProps(node){
  const data=nodes.find(n=>n.id===node.dataset.id);
  const t=nodeTemplates[node.dataset.type];
  let html=`<div class="prop"><label>유형</label><input value="${node.dataset.type}" readonly></div>
    <div class="prop"><label>ID</label><input value="${node.dataset.id}" readonly></div>
    <div class="prop"><label>라벨</label><input value="${node.querySelector('.node-content').textContent}" onchange="updateNodeLabel(node,this.value)"></div>
    <div class="prop"><label>X</label><input type="number" value="${Math.round(data.x)}" onchange="updateNodePos(node,'x',this.value)"></div>
    <div class="prop"><label>Y</label><input type="number" value="${Math.round(data.y)}" onchange="updateNodePos(node,'y',this.value)"></div>
    <div class="prop"><label>색상</label><input type="color" value="${t.color}" onchange="updateNodeColor(node,this.value)"></div>`;
  propPanel.innerHTML=html;
}

function updateNodeLabel(node,val){node.querySelector('.node-content').textContent=val}
function updateNodePos(node,prop,val){
  const data=nodes.find(n=>n.id===node.dataset.id);
  data[prop]=parseFloat(val);
  node.style[prop==='x'?'left':'top']=`${val}px`;
  updateConnections(node);
  updateMinimap();
}
function updateNodeColor(node,val){
  node.querySelector('.node-content').style.borderColor=val;
  updateConnections(node);
}

function startDrag(e,node){
  if(e.target.classList.contains('port'))return;
  const data=nodes.find(n=>n.id===node.dataset.id);
  const startX=e.clientX,startY=e.clientY;
  const origX=data.x,origY=data.y;
  
  function move(ev){
    data.x=origX+(ev.clientX-startX)/scale;
    data.y=origY+(ev.clientY-startY)/scale;
    node.style.left=`${data.x}px`;
    node.style.top=`${data.y}px`;
    updateConnections(node);
    updateMinimap();
  }
  function up(){document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up)}
  document.addEventListener('mousemove',move);
  document.addEventListener('mouseup',up);
}

function startConnection(e,port){
  e.stopPropagation();
  connectingFrom=port.dataset.node;
  connectStartPort=port.dataset.port;
  port.style.background='var(--good)';
  
  function move(ev){
    if(!connectingFrom)return;
    // 임시 선 그리기 로직 생략
  }
  function up(ev){
    document.removeEventListener('mousemove',move);
    document.removeEventListener('mouseup',up);
    const targetPort=ev.target;
    if(targetPort.classList.contains('port')&&targetPort.dataset.node!==connectingFrom){
      createConnection(connectingFrom,connectStartPort,targetPort.dataset.node,targetPort.dataset.port);
    }
    document.querySelectorAll('.port').forEach(p=>p.style.background='');
    connectingFrom=null;connectStartPort=null;
  }
  document.addEventListener('mousemove',move);
  document.addEventListener('mouseup',up);
}

function createConnection(fromNode,fromPort,toNode,toPort){
  const fn=nodes.find(n=>n.id===fromNode);
  const tn=nodes.find(n=>n.id===toNode);
  if(!fn||!tn)return;
  
  const id=`conn${++connId}`;
  const line=document.createElementNS('http://www.w3.org/2000/svg','path');
  line.dataset.id=id;
  line.dataset.from=fromNode;
  line.dataset.to=toNode;
  line.dataset.fromPort=fromPort;
  line.dataset.toPort=toPort;
  line.classList.add('connection');
  line.onclick=e=>{e.stopPropagation();selectConnection(line)};
  canvas.appendChild(line);
  
  connections.push({id,fromNode,fromPort,toNode,toPort,element:line});
  updateConnection(line);
  updateMinimap();
}

function selectConnection(line){
  document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));
  document.querySelectorAll('.connection').forEach(c=>c.classList.remove('selected'));
  line.classList.add('selected');
  selectedConnection=line;
  selectedNode=null;
  showConnProps(line);
}

function showConnProps(line){
  propPanel.innerHTML=`<div class="prop"><label>연결 ID</label><input value="${line.dataset.id}" readonly></div>
    <div class="prop"><label>시작: ${line.dataset.from} (${line.dataset.fromPort})</label></div>
    <div class="prop"><label>끝: ${line.dataset.to} (${line.dataset.toPort})</label></div>
    <button class="btn secondary" style="width:100%" onclick="deleteConnection('${line.dataset.id}')">연결 삭제</button>`;
}

function deleteConnection(id){
  connections=connections.filter(c=>c.id!==id);
  document.querySelector(`.connection[data-id="${id}"]`)?.remove();
  selectedConnection=null;
  propPanel.innerHTML='<div style="color:var(--muted);text-align:center;padding:20px">노드를 선택하세요</div>';
  updateMinimap();
}

function updateConnections(node){
  const id=node.dataset.id;
  connections.filter(c=>c.fromNode===id||c.toNode===id).forEach(c=>updateConnection(c.element));
}

function updateConnection(line){
  const fn=nodes.find(n=>n.id===line.dataset.from);
  const tn=nodes.find(n=>n.id===line.dataset.to);
  if(!fn||!tn)return;
  
  const fx=fn.x+fn.element.offsetWidth/2;
  const fy=fn.y+fn.element.offsetHeight/2;
  const tx=tn.x+tn.element.offsetWidth/2;
  const ty=tn.y+tn.element.offsetHeight/2;
  
  // 간단한 직선 연결 (실제로는 포트 위치 계산 필요)
  const d=`M${fx},${fy} L${tx},${ty}`;
  line.setAttribute('d',d);
}

function updateMinimap(){
  const scaleM=0.1;
  minimapView.innerHTML='';
  nodes.forEach(n=>{
    const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
    r.setAttribute('x',n.x*scaleM);
    r.setAttribute('y',n.y*scaleM);
    r.setAttribute('width',n.element.offsetWidth*scaleM);
    r.setAttribute('height',n.element.offsetHeight*scaleM);
    r.setAttribute('fill',nodeTemplates[n.type].color+'44');
    r.setAttribute('stroke',nodeTemplates[n.type].color);
    r.setAttribute('stroke-width','0.5');
    minimapView.appendChild(r);
  });
  connections.forEach(c=>{
    const fn=nodes.find(n=>n.id===c.fromNode);
    const tn=nodes.find(n=>n.id===c.toNode);
    if(fn&&tn){
      const l=document.createElementNS('http://www.w3.org/2000/svg','line');
      l.setAttribute('x1',(fn.x+fn.element.offsetWidth/2)*scaleM);
      l.setAttribute('y1',(fn.y+fn.element.offsetHeight/2)*scaleM);
      l.setAttribute('x2',(tn.x+tn.element.offsetWidth/2)*scaleM);
      l.setAttribute('y2',(tn.y+tn.element.offsetHeight/2)*scaleM);
      l.setAttribute('stroke','var(--accent)');
      l.setAttribute('stroke-width','0.5');
      minimapView.appendChild(l);
    }
  });
  // 뷰포트 표시
  const vp=document.createElementNS('http://www.w3.org/2000/svg','rect');
  vp.setAttribute('x',-panX*scaleM);
  vp.setAttribute('y',-panY*scaleM);
  vp.setAttribute('width',canvasArea.clientWidth*scaleM);
  vp.setAttribute('height',canvasArea.clientHeight*scaleM);
  vp.setAttribute('fill','none');
  vp.setAttribute('stroke','var(--good)');
  vp.setAttribute('stroke-width','1');
  vp.setAttribute('stroke-dasharray','2,2');
  minimapView.appendChild(vp);
}

canvasArea.addEventListener('wheel',e=>{
  e.preventDefault();
  const factor=e.deltaY>0?0.9:1.1;
  scale=Math.max(0.1,Math.min(3,scale*factor));
  canvasArea.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;
});

canvasArea.addEventListener('mousedown',e=>{
  if(e.target===canvasArea||e.target===canvas){
    isPanning=true;
    panStart={x:e.clientX-panX,y:e.clientY-panY};
    canvasArea.style.cursor='grabbing';
    selectNode(null);
  }
});

document.addEventListener('mousemove',e=>{
  if(isPanning){
    panX=e.clientX-panStart.x;
    panY=e.clientY-panStart.y;
    canvasArea.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;
  }
});

document.addEventListener('mouseup',()=>{isPanning=false;canvasArea.style.cursor='default'});

function newDiagram(){
  if(confirm('새 다이어그램을 만드시겠습니까?')){
    nodes=[];connections=[];nodeId=0;connId=0;
    canvasArea.querySelectorAll('.node').forEach(n=>n.remove());
    canvas.innerHTML='';
    selectedNode=null;selectedConnection=null;
    propPanel.innerHTML='<div style="color:var(--muted);text-align:center;padding:20px">노드를 선택하세요</div>';
    updateMinimap();
  }
}

function exportJSON(){
  const data={nodes:nodes.map(n=>({id:n.id,type:n.type,x:n.x,y:n.y,label:n.element.querySelector('.node-content').textContent})),
    connections:connections.map(c=>({id:c.id,from:c.fromNode,fromPort:c.fromPort,to:c.toNode,toPort:c.toPort}))};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='diagram.json';
  a.click();
}

function importJSON(){document.getElementById('jsonFile').click()}

function loadJSON(e){
  const f=e.target.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      newDiagram();
      data.nodes.forEach(n=>{createNode(n.type,n.x,n.y);const node=document.querySelector(`[data-id="${n.id}"]`);if(node)node.querySelector('.node-content').textContent=n.label});
      data.connections.forEach(c=>createConnection(c.from,c.fromPort,c.to,c.toPort));
    }catch(err){alert('파일 형식 오류')}
  };
  reader.readAsText(f);
}

function exportPNG(){
  const svgData=new XMLSerializer().serializeToString(canvas);
  const img=new Image();
  const blob=new Blob([svgData],{type:'image/svg+xml'});
  img.src=URL.createObjectURL(blob);
  img.onload=()=>{
    const c=document.createElement('canvas');
    c.width=3000;c.height=2000;
    const ctx=c.getContext('2d');
    ctx.fillStyle='#0d1117';ctx.fillRect(0,0,3000,2000);
    ctx.drawImage(img,0,0);
    c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='diagram.png';a.click()});
  };
}
</script>
</body>
</html>
