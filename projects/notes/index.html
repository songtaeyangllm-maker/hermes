<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Notes</title>
<style>
:root { --bg:#0b0e16; --text:#e5e7eb; --muted:#6b7686; --card:#121826; --border:#1e2840; --accent:#60a5fa; --good:#4ade80; --bad:#ef4444; }
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;padding:32px}h1{font-size:28px;letter-spacing:2px;margin-bottom:8px}h1 span{color:var(--accent)}.sub{color:var(--muted);font-size:14px;margin-bottom:32px}.notes-grid{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;max-width:800px}.note-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:20px;margin:12px 0;transition:transform .2s}.note-card:hover{transform:translateX(4px)}.note-card.deleted{opacity:.3;transform:translateX(0)}.note-title{font-size:14px;font-weight:bold;color:var(--text);margin-bottom:4px}.note-meta{color:var(--muted);font-size:11px;margin-bottom:8px}.action-row{display:flex;gap:8px;align-items:center}.btn{background:var(--accent);color:#0b0e16;border:none;padding:8px 16px;font-size:13px;font-weight:bold;cursor;border-radius:6px;transition:opacity .2s}.btn:hover{opacity:.9}.btn-danger{background:var(--bad);color:#fff}.note-input{width:100%;background:var(--card2);border:1px solid var(--border);padding:10px;font-size:14px;color:var(--text);border-radius:6x;margin-top:12px}.empty{color:var(--muted);text-align:center;padding:20px}.footer{margin-top:32px;color:var(--muted);font-size:12px;text-align:center}.link{color:var(--accent);text-decoration:none;font-weight:bold;font-size:13px}.link:hover{text-decoration:underline}</style>
</head>
<body>
<h1>NOTES <span></span></h1>
<div class="sub">메모 작성·조회·삭제</div>
<div class="notes-grid" id="notesGrid">
  <div class="empty">메모가 없습니다. 위의 입력창에 메모를 추가해 보세요.</div>
</div>
<div class="action-row">
  <input class="note-input" id="noteInput" placeholder="새 메모 제목을 입력하세요">
  <button class="btn" onclick="addNote()">추가</button>
</div>
<script>
// 데이터 저장소 (localStorage)
let notes = JSON.parse(localStorage.getItem('hermesNotes')||'[]');
const notesGrid=document.getElementById('notesGrid');
function renderNotes(){
  if(notes.length===0){notesGrid.innerHTML='<div class="empty">메모가 없습니다. 위의 입력창에 메모를 추가해 보세요.</div>';return;}
  notesGrid.innerHTML=notes.map((note,i)=>`<div class="note-card" data-index="${i}" ontouchstart="this.style.transform='translateX(4px)'" ontouchend="this.style.transform='translateX(0)'">
    <div class="note-title">${note.title}</div>
    <div class="note-meta">생성: ${new Date(note.created).toLocaleString()}</div>
    <div class="action-row">
      <button class="btn" onclick="editNote(${i})">수정</button>
      <button class="btn btn-danger" onclick="deleteNote(${i})">삭제</button>
    </div>
  </div>`).join('');
  notesGrid.innerHTML=document.querySelector('.empty')?document.querySelector('.empty').outerHTML:notesGrid.innerHTML
}
function addNote(){const title=document.getElementById('noteInput').value.trim();if(!title)return;notes.unshift({title,created:Date.now()});localStorage.setItem('hermesNotes',JSON.stringify(notes));renderNotes();document.getElementById('noteInput').value=''}
function editNote(i){const newTitle=prompt('메모 제목을 수정하세요:',notes[i].title);if(newTitle!==null&&newTitle.trim()){notes[i].title=newTitle.trim();localStorage.setItem('hermesNotes',JSON.stringify(notes));renderNotes()}}
function deleteNote(i){if(confirm('정말로 삭제하시겠습니까?')){notes.splice(i,1);localStorage.setItem('hermesNotes',JSON.stringify(notes));renderNotes()}}
renderNotes()
</script>
</body>
</html>
